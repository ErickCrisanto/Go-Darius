<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GO DARIUS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { font-family:'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { background:linear-gradient(180deg,#62bfff 0%, #93c5fd 48%, #f9a8d4 100%); min-height:100vh; color:#1e293b; transition:background 1s; overflow-x:hidden; }
  body.t-space { background:linear-gradient(180deg,#0f172a 0%, #1e1b4b 50%, #4c1d95 100%); }
  body.t-bruja { background:linear-gradient(180deg,#4c1d95 0%, #6d28d9 45%, #312073 100%); }
  body.t-escuela { background:linear-gradient(180deg,#fbbf24 0%, #f97316 45%, #fca5a5 100%); }
  body.t-neon { background:linear-gradient(180deg,#0c0a1e 0%, #2e1065 45%, #155e75 100%); }
  body.t-futbol { background:linear-gradient(180deg,#16a34a 0%, #22c55e 45%, #86efac 100%); }
  body.t-mar { background:linear-gradient(180deg,#0891b2 0%, #0ea5e9 45%, #67e8f9 100%); }
  body.girl { background:linear-gradient(180deg,#fce7f3 0%, #e9d5ff 45%, #fbcfe8 100%); }
  body.girl .card { border-color:#f9a8d4; }
  body.girl .wemoji, body.girl .avatar { filter:hue-rotate(280deg) saturate(1.2); }
  body.girl .bigbtn, body.girl .qopt { background:#ec4899; }
  body.girl .tabbtns button.sel { background:#db2777; border-color:#db2777; }
  body.t-estrellas { background:linear-gradient(180deg,#1e1b4b 0%, #312e81 40%, #7c3aed 100%); }

  /* Nubes decorativas animadas en CSS puro */
  .bg-cloud { position:fixed; background:rgba(255,255,255,.32); border-radius:60px; pointer-events:none; z-index:0; animation:cloudFloat linear infinite; }
  .bg-cloud::before, .bg-cloud::after { content:""; position:absolute; background:rgba(255,255,255,.32); border-radius:50%; }
  .bg-cloud.c1 { width:135px; height:42px; top:7%; left:-150px; animation-duration:34s; }
  .bg-cloud.c1::before { width:60px; height:60px; top:-28px; left:20px; }
  .bg-cloud.c1::after { width:48px; height:48px; top:-18px; left:66px; }
  .bg-cloud.c2 { width:175px; height:50px; top:58%; left:-200px; animation-duration:44s; animation-delay:6s; }
  .bg-cloud.c2::before { width:76px; height:76px; top:-36px; left:28px; }
  .bg-cloud.c2::after { width:58px; height:58px; top:-22px; left:92px; }
  @keyframes cloudFloat { from { transform:translateX(0); } to { transform:translateX(120vw); } }

  #app { max-width:1040px; margin:0 auto; padding:12px 16px 86px; position:relative; z-index:1; }

  @keyframes screenIn { from { opacity:0; transform:translateX(40px) scale(.98);} to { opacity:1; transform:none;} }
  @keyframes screenInBack { from { opacity:0; transform:translateX(-40px) scale(.98);} to { opacity:1; transform:none;} }
  @keyframes pop { 0%{transform:scale(.5);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes jump { 0%,100%{transform:translateY(0) scale(1)} 30%{transform:translateY(-24px) scale(1.05)} 60%{transform:translateY(0) scale(.96)} }
  @keyframes wiggle { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:.6; } }
  @keyframes starfly { 0%{transform:scale(1)} 50%{transform:scale(1.6) rotate(15deg)} 100%{transform:scale(1)} }
  @keyframes shine { 0%,100%{filter:drop-shadow(0 0 0 gold)} 50%{filter:drop-shadow(0 0 12px gold)} }
  @keyframes progress { from { width:0 } }
  @keyframes zoombg { from{opacity:0; transform:scale(.5)} to{opacity:1; transform:scale(1)} }
  .screen-anim { animation:screenIn .35s cubic-bezier(.2,.8,.3,1); }
  .screen-anim.back { animation:screenInBack .35s cubic-bezier(.2,.8,.3,1); }
  .pop { animation:pop .3s ease-out; }
  .floaty { animation:floaty 3s ease-in-out infinite; }
  .jump { animation:jump 1.2s ease-in-out infinite; }

  /* Cabecera Unificada Compacta */
  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:10px; background:rgba(255,255,255,.94); padding:10px 16px; border-radius:24px; border:3px solid #fff; box-shadow:0 6px 0 rgba(22,47,89,.12); flex-wrap:wrap; }
  body.t-space .topbar, body.t-neon .topbar, body.t-estrellas .topbar { background:rgba(30,41,59,.94); border-color:#475569; }
  .avatar { width:58px; height:58px; border-radius:50%; background:#fff9db; display:flex; align-items:center; justify-content:center; font-size:32px; border:4px solid #fbbf24; box-shadow:0 4px 10px rgba(0,0,0,.12); position:relative; flex-shrink:0; cursor:pointer; }
  .avatar .hat { position:absolute; top:-14px; font-size:20px; }
  .hello { flex:1; min-width:220px; }
  .hello-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .hello h1 { font-family:'Fredoka',sans-serif; font-size:23px; font-weight:700; color:#1e293b; }
  body.t-space .hello h1, body.t-neon .hello h1, body.t-estrellas .hello h1 { color:#f8fafc; }
  .speech-pill { background:#e0f2fe; border:2px solid #7dd3fc; color:#0369a1; font-size:12.5px; font-weight:800; padding:3px 11px; border-radius:14px; display:inline-flex; align-items:center; gap:5px; }
  body.t-space .speech-pill, body.t-neon .speech-pill, body.t-estrellas .speech-pill { background:#1e1b4b; border-color:#6366f1; color:#e0e7ff; }
  .hello .lvlbadge { display:inline-block; background:linear-gradient(90deg,#fbbf24,#f59e0b); color:#78350f; font-weight:900; font-size:11.5px; padding:3px 11px; border-radius:99px; margin-top:4px; }
  .starbox { background:#fff9db; border:3px solid #fbbf24; border-bottom-width:5px; border-radius:99px; padding:6px 16px; font-family:'Fredoka',sans-serif; font-weight:700; font-size:19px; color:#b45309; display:flex; align-items:center; gap:6px; }
  .starbox.fly { animation:starfly .6s ease; }
  .starbox .st { font-size:20px; animation:shine 2.5s infinite; }
  .dragonbtn { position:fixed; bottom:16px; right:14px; z-index:110; width:62px; height:62px; border:none; border-radius:50%; background:#fff; font-size:32px; box-shadow:0 6px 0 #d97706, 0 8px 18px rgba(0,0,0,.28); cursor:pointer; border:3px solid #fbbf24; }
  .dragonbtn:active { transform:translateY(3px); }

  .card { background:rgba(255,255,255,.95); border-radius:24px; padding:14px 18px; border:3px solid #fff; box-shadow:0 6px 0 rgba(22,47,89,.12); margin-bottom:12px; }
  body.t-space .card, body.t-neon .card, body.t-estrellas .card { background:rgba(30,41,59,.92); color:#f1f5f9; border-color:#334155; }
  .card h2 { font-family:'Fredoka',sans-serif; font-size:17px; font-weight:700; margin-bottom:8px; color:#1e293b; display:flex; align-items:center; gap:6px; }
  body.t-space .card h2, body.t-neon .card h2, body.t-estrellas .card h2 { color:#a5b4fc; }

  /* Misión de hoy en fila horizontal de 3 columnas */
  .missions-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .missions-header h2 { margin-bottom:0; }
  .missions-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:720px){ .missions-grid { grid-template-columns:1fr; } }
  .mission-item { display:flex; align-items:center; gap:10px; padding:9px 12px; font-weight:800; font-size:14px; background:#f8fafc; border:2px solid #e2e8f0; border-bottom-width:5px; border-radius:16px; cursor:pointer; transition:transform .12s, background .15s; color:#1e293b; }
  .mission-item:hover { transform:translateY(-2px); background:#f1f5f9; border-color:#cbd5e1; }
  .mission-item:active { transform:translateY(2px); }
  .mission-item .mcheck { width:26px; height:26px; border-radius:50%; border:3px solid #cbd5e1; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; background:#fff; }
  .mission-item.done { background:#dcfce7; border-color:#4ade80; color:#15803d; }
  .mission-item.done .mcheck { background:#22c55e; border-color:#16a34a; color:#fff; }
  .giftrow { display:inline-flex; align-items:center; gap:8px; background:#fef9c3; border:2px solid #fde047; border-radius:12px; padding:4px 12px; font-weight:900; font-size:12.5px; color:#854d0e; }
  .giftrow.ready { background:#22c55e; border-color:#16a34a; color:#fff; animation:wiggle 1s infinite; }

  /* Cinta de Mapa de Mundos con Alto Contraste */
  .sectiontitle { display:flex; justify-content:center; margin:6px 0 10px; }
  .sectiontitle span { background:#162f59; color:#fff; font-family:'Fredoka',sans-serif; font-size:14.5px; letter-spacing:.5px; padding:6px 22px; border-radius:99px; border:2px solid #93c5fd; box-shadow:0 4px 0 rgba(0,0,0,.2); }

  /* Mapa de Mundos con estilo de Botones 3D */
  .map { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:2px 0 14px; }
  .world { position:relative; z-index:1; width:100%; margin:0; border:3px solid rgba(255,255,255,.35); border-radius:24px; padding:16px 12px 14px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:6px; cursor:pointer; box-shadow:0 7px 0 rgba(0,0,0,.28), 0 10px 18px rgba(0,0,0,.15); transition:transform .12s, box-shadow .12s; text-align:center; min-height:148px; }
  .world:hover { transform:translateY(-4px); }
  .world:active { transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.28); }
  .world .wemoji { font-size:44px; flex-shrink:0; filter:drop-shadow(0 4px 4px rgba(0,0,0,.2)); }
  .world .winfo { width:100%; color:#fff; }
  .world .winfo b { display:block; font-family:'Fredoka',sans-serif; font-size:18px; font-weight:700; text-shadow:0 2px 3px rgba(0,0,0,.28); }
  .world .winfo small { display:block; font-size:12px; font-weight:800; opacity:.95; margin-top:2px; }
  .world .wstars { font-size:11.5px; background:rgba(0,0,0,.34); color:#fff; padding:4px 12px; border-radius:99px; font-weight:900; }
  @media (min-width:760px){ .map { grid-template-columns:repeat(3,1fr); } }
  @media (min-width:1020px){ .map { grid-template-columns:repeat(4,1fr); } #app { max-width:1140px; } }
  @media (max-width:379px){ .map { grid-template-columns:1fr; } }

  /* ===== MATES MERGE 3D (estilo 2248 del video) ===== */
  .mm-hud { display:flex; justify-content:space-between; align-items:center; max-width:430px; margin:0 auto 8px; }
  .mm-pill { background:#172246; border:2px solid #2e4382; color:#fff; font-family:'Fredoka',sans-serif; font-weight:700; padding:6px 14px; border-radius:50px; font-size:13.5px; box-shadow:0 3px 0 #060a17; white-space:nowrap; display:flex; align-items:center; gap:5px; }
  .mm-score { font-family:'Fredoka','Segoe UI',sans-serif; font-size:32px; font-weight:700; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.5); line-height:1; }
  .mm-score.bump { animation:mmbump .3s; }
  @keyframes mmbump { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .mm-goalbar { position:relative; display:flex; align-items:center; justify-content:space-between; background:#131c3b; border:2px solid #25386b; border-radius:18px; padding:10px 16px; max-width:430px; margin:0 auto 12px; }
  .mm-goalline { position:absolute; left:52px; right:52px; height:5px; background:linear-gradient(90deg,#fbbf24,#f43f5e); border-radius:4px; z-index:0; }
  .mm-minitile { width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:'Fredoka','Segoe UI',sans-serif; font-size:17px; font-weight:700; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.4); position:relative; z-index:1; background:#334155; transition:transform .15s, background .15s; }
  .mm-minitile.center { width:56px; height:56px; font-size:20px; border:3px solid #ff85a1; transform:scale(1.06); }
  .mm-minitile.center::before { content:"👑"; position:absolute; top:-11px; font-size:12px; }
  .mm-minitile small { position:absolute; top:-15px; font-size:9px; font-weight:900; color:#94a3b8; letter-spacing:.5px; }
  #mm-board { position:relative; background:#070b19; padding:12px; border-radius:24px; border:3px solid #25386b; box-shadow:0 10px 0 #050814, 0 15px 30px rgba(0,0,0,.35); max-width:430px; margin:0 auto; user-select:none; -webkit-user-select:none; touch-action:none; }
  #mm-svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:3; }
  .mm-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; position:relative; }
  .mmtile { position:relative; z-index:2; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:13px; font-family:'Fredoka','Segoe UI',sans-serif; font-size:20px; font-weight:700; color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.38); transition:transform .16s cubic-bezier(.34,1.56,.64,1), filter .16s; cursor:pointer; }
  .mmtile .mmtxt { position:relative; z-index:6; text-shadow:0 2px 3px rgba(0,0,0,.35); pointer-events:none; }
  .mmtile.king { border:2px solid #ff85a1; }
  .mmtile.king::before { content:"👑"; position:absolute; top:-7px; right:2px; font-size:13px; z-index:7; filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  .mmtile.pop-anim { animation:popMerge .34s cubic-bezier(.34,1.56,.64,1); }
  .mmtile.drop-anim { animation:dropTile .26s cubic-bezier(.22,1,.36,1); }
  @keyframes popMerge { 0%{transform:scale(.35)} 65%{transform:scale(1.22)} 100%{transform:scale(1)} }
  @keyframes dropTile { 0%{transform:translateY(-42px); opacity:.65} 100%{transform:translateY(0); opacity:1} }
  . val2, .mmtile.val2, .mm-minitile.val2{background:#27ae60;box-shadow:0 5px 0 #1e8449}
  .mmtile.val4, .mm-minitile.val4{background:#2980b9;box-shadow:0 5px 0 #1f618d}
  .mmtile.val8, .mm-minitile.val8{background:#d35400;box-shadow:0 5px 0 #a04000}
  .mmtile.val16, .mm-minitile.val16{background:#c2185b;box-shadow:0 5px 0 #880e4f}
  .mmtile.val32, .mm-minitile.val32{background:#7b1fa2;box-shadow:0 5px 0 #4a148c}
  .mmtile.val64, .mm-minitile.val64{background:#7f1d1d;box-shadow:0 5px 0 #450a0a}
  .mmtile.val128, .mm-minitile.val128{background:#512da8;box-shadow:0 5px 0 #311b92}
  .mmtile.val256, .mm-minitile.val256{background:#1f618d;box-shadow:0 5px 0 #154360}
  .mmtile.val512, .mm-minitile.val512{background:#0e7490;box-shadow:0 5px 0 #164e63}
  .mmtile.val1024, .mm-minitile.val1024{background:#b45309;box-shadow:0 5px 0 #78350f}
  .mmtile.val2048, .mm-minitile.val2048{background:#be123c;box-shadow:0 5px 0 #831843}
  .mmtile.val4096, .mm-minitile.val4096{background:#9d174d;box-shadow:0 5px 0 #581c87}
  .mmtile.val8192, .mm-minitile.val8192{background:#4338ca;box-shadow:0 5px 0 #312e81}
  .mmtile.sel { transform:scale(1.07); box-shadow:0 0 0 3.5px #fff, 0 6px 14px rgba(0,0,0,.5); filter:brightness(1.12); z-index:5; }
  .mm-float { position:absolute; font-family:'Fredoka','Segoe UI',sans-serif; font-size:24px; font-weight:700; color:#fff; text-shadow:0 3px 6px rgba(0,0,0,.6); pointer-events:none; z-index:20; animation:mmfloatup .75s ease-out forwards; }
  @keyframes mmfloatup { 0%{transform:translate(-50%,0) scale(.8); opacity:1} 100%{transform:translate(-50%,-45px) scale(1.15); opacity:0} }
  .mm-excellent { position:absolute; top:42%; left:50%; transform:translate(-50%,-50%); background:linear-gradient(90deg,#00c6ff,#0072ff); border:3px solid #fff; padding:8px 22px; border-radius:20px; font-family:'Fredoka',sans-serif; font-size:22px; color:#fff; z-index:30; pointer-events:none; box-shadow:0 10px 25px rgba(0,0,0,.55); text-align:center; animation:mmExcPop 1.05s ease forwards; }
  @keyframes mmExcPop { 0%{transform:translate(-50%,-50%) scale(.3);opacity:0} 25%{transform:translate(-50%,-50%) scale(1.12);opacity:1} 80%{transform:translate(-50%,-50%) scale(1);opacity:1} 100%{transform:translate(-50%,-70%) scale(.85);opacity:0} }
  .mm-part { position:absolute; width:10px; height:10px; border-radius:3px; pointer-events:none; z-index:19; animation:mmpart .65s ease-out forwards; }
  @keyframes mmpart { 0%{transform:translate(0,0) scale(1); opacity:1} 100%{transform:translate(var(--dx,0px), var(--dy,-60px)) scale(.2); opacity:0} }
  .mm-powers { display:flex; gap:10px; max-width:430px; margin:12px auto 0; }
  .mm-power { flex:1; background:#172246; border:2px solid #2e4382; border-bottom-width:5px; color:#fff; font-family:'Fredoka',sans-serif; font-weight:700; font-size:13px; padding:10px 6px; border-radius:16px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; transition:transform .1s, background .15s; }
  .mm-power small { font-family:'Nunito',sans-serif; font-size:10px; color:#94a3b8; font-weight:800; }
  .mm-power:active { transform:translateY(3px); }
  .mm-power.active-mode { background:#e03131; border-color:#ff8787; }
  .lvlbar { height:9px; background:rgba(0,0,0,.28); border-radius:99px; margin-top:6px; overflow:hidden; }
  .lvlbar i { display:block; height:100%; background:#fde047; border-radius:99px; }

  .bigbtn { border:none; border-radius:20px; padding:14px; font-family:'Fredoka',sans-serif; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.22); transition:transform .1s, box-shadow .1s; color:#fff; }
  .bigbtn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.22); }
  .gridbtns { display:grid; gap:10px; }
  .chip { border:3px solid #e2e8f0; border-bottom-width:5px; background:rgba(255,255,255,.9); border-radius:18px; padding:12px 8px; font-weight:900; font-size:13px; text-align:center; cursor:pointer; transition:transform .1s; display:flex; flex-direction:column; align-items:center; gap:6px; color:#1e293b; }
  .chip:active { transform:scale(.95); }
  .chip.sel { background:#fbbf24; border-color:#d97706; }
  .chip .big { font-size:38px; line-height:1; }
  .chip.newone { border-style:dashed; border-color:#22c55e; background:#f0fdf4; }

  .phrasebar { background:#fffbeb; border:3px dashed #f59e0b; border-radius:18px; padding:12px; min-height:60px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; }
  .token { background:#f59e0b; color:#fff; font-weight:900; padding:6px 12px; border-radius:99px; font-size:15px; animation:pop .25s; cursor:pointer; }
  .token.con { background:#f97316; } .token.cony { background:#8b5cf6; }
  .token .x { opacity:.7; font-size:11px; margin-left:3px; }
  .token.empty { background:#e2e8f0; color:#94a3b8; cursor:default; }

  .scene { background:linear-gradient(180deg,#fce7f3,#e9d5ff); border-radius:20px; padding:24px 10px; text-align:center; font-size:56px; line-height:1.15; margin-bottom:12px; min-height:140px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px; }
  .storytext { font-size:21px; font-weight:900; text-align:center; line-height:1.45; padding:0 6px; }
  .storynav { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .qopt { width:100%; border:3px solid #e9d5ff; border-bottom-width:5px; background:#fae8ff; border-radius:16px; padding:13px; font-size:17px; font-weight:900; cursor:pointer; color:#6b21a8; }
  .qopt:active { transform:translateY(2px); }

  .feedback { text-align:center; font-size:20px; font-weight:900; padding:10px; animation:pop .3s; }
  .ok { color:#16a34a; } .bad { color:#e11d48; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:300; background:#1e293b; color:#fff; font-weight:900; padding:12px 22px; border-radius:99px; font-size:15px; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:pop .3s; max-width:90vw; text-align:center; }
  .confetti { position:fixed; top:-40px; z-index:250; font-size:26px; pointer-events:none; animation:fall 2.2s linear forwards; }

  .navrow { position:fixed; top:12px; left:12px; z-index:100; display:flex; gap:8px; }
  .navrow button { width:46px; height:46px; border:none; border-radius:50%; background:rgba(255,255,255,.95); font-size:22px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.18); }
  .navrow button:active { transform:translateY(2px); }
  .dadbtn { display:block; margin:0 auto 20px; border:none; border-radius:99px; padding:13px 30px; background:#334155; color:#fff; font-family:'Fredoka',sans-serif; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 5px 0 #1e293b; }

  .statgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:linear-gradient(180deg,#eff6ff,#dbeafe); border-radius:16px; padding:10px 4px; text-align:center; }
  .stat b { font-size:22px; display:block; color:#1d4ed8; }
  .stat small { font-size:10px; font-weight:800; color:#475569; }
  .weekbar { margin:8px 0; }

<script>
/* =========================================================
   GO DARIUS PRO — App de lenguaje y aprendizaje gamificada
   Un archivo HTML. Sin backend. Datos en localStorage.
   ========================================================= */

// ---------- ESTADO BLINDADO ----------
const DEFAULT_STATE = {
  name: "Darius", age: 4, gender: "nino", stars: 0, totalStars: 0, theme: "",
  worlds: { siento:{ok:0,err:0,clicks:0}, necesito:{ok:0,err:0,clicks:0}, dia:{ok:0,err:0,clicks:0},
            cuentos:{ok:0,err:0,clicks:0}, puente:{ok:0,err:0,clicks:0}, crear:{ok:0,err:0,clicks:0},
            mate:{ok:0,err:0,clicks:0}, english:{ok:0,err:0,clicks:0}, dibujar:{ok:0,err:0,clicks:0}, juegos:{ok:0,err:0,clicks:0} },
  today: { date:"", minutes:0, ok:0, err:0, emotions:0, missions:[], missionSet:[], gift:false },
  history: [], phrases: [], customDia: [], customMotivos: []
};
let S = loadState();
function loadState(){
  const def = JSON.parse(JSON.stringify(DEFAULT_STATE));
  try {
    const raw = localStorage.getItem("gdpro2");
    if(raw){
      const p = JSON.parse(raw);
      const merged = Object.assign({}, def, p);
      merged.worlds = Object.assign({}, def.worlds, p.worlds || {});
      Object.keys(def.worlds).forEach(k=>{
        merged.worlds[k] = Object.assign({ok:0,err:0,clicks:0}, merged.worlds[k] || {});
      });
      merged.today = Object.assign({}, def.today, p.today || {});
      if(!Array.isArray(merged.today.missions)) merged.today.missions = [];
      if(!Array.isArray(merged.history)) merged.history = [];
      if(!Array.isArray(merged.customDia)) merged.customDia = [];
      if(!Array.isArray(merged.customMotivos)) merged.customMotivos = [];
      return merged;
    }
  } catch(e){}
  return def;
}
function save(){ try { localStorage.setItem("gdpro2", JSON.stringify(S)); } catch(e){} }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esNina(){ return S.gender === "nina"; }
function gChamp(){ return esNina() ? "campeona" : "campeón"; }
function gHeroe(){ return esNina() ? "heroína" : "héroe"; }
function setGenero(g){ S.gender = g; save(); applyTheme(); go("dad", {back:true}); }
function ensureToday(){ if(S.today.date !== todayISO()){ S.today = { date:todayISO(), minutes:0, ok:0, err:0, emotions:0, missions:[], missionSet:[], gift:false }; save(); } }
setInterval(()=>{ ensureToday(); if(document.visibilityState==="visible"){ S.today.minutes += 0.5; save(); } }, 30000);

// ---------- VOZ ----------
function speak(text, lang, cb){
  try {
    if(!("speechSynthesis" in window)){ if(cb) cb(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "es-ES"; u.rate = 0.92; u.pitch = 1.1;
    if(cb) u.onend = cb;
    window.speechSynthesis.speak(u);
  } catch(e){ if(cb) cb(); }
}

// ---------- SONIDOS ----------
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null;
function tone(freq, dur, delay, type, vol){
  try{
    if(!AC) return;
    if(!actx) actx = new AC();
    if(actx.state === "suspended") actx.resume();
    const t = actx.currentTime + (delay||0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  ok(){ [523,659,784].forEach((f,i)=>tone(f,.25,i*.09,"triangle",.18)); },
  star(){ [880,1174].forEach((f,i)=>tone(f,.3,i*.12,"sine",.15)); },
  bad(){ tone(220,.3,0,"sine",.12); },
  tap(){ tone(660,.08,0,"sine",.07); },
  unlock(){ [523,659,784,1046].forEach((f,i)=>tone(f,.35,i*.11,"triangle",.2)); }
};
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function confetti(){
  const ems = ["⭐","🎉","✨","🌟","🎊","💛"];
  for(let i=0;i<36;i++){
    const d = document.createElement("div");
    d.className = "confetti";
    d.textContent = ems[Math.floor(Math.random()*ems.length)];
    d.style.left = (Math.random()*100)+"vw";
    d.style.animationDelay = (Math.random()*0.5)+"s";
    d.style.fontSize = (18+Math.random()*20)+"px";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 2800);
  }
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

// ---------- CONFIRMACIÓN PARA ADULTOS (CANDADO PARENTAL) ----------
let adultTargetAction = null, adultExpected = 0;
function askAdultConfirmation(actionFn, subtitle){
  sfx.tap();
  const a = 6 + Math.floor(Math.random()*4);
  const b = 7 + Math.floor(Math.random()*3);
  adultExpected = a * b;
  adultTargetAction = actionFn;
  const bg = document.createElement("div");
  bg.className = "modalbg";
  bg.id = "adult-gate-modal";
  bg.innerHTML = '<div class="modalbox">' +
    '<p style="font-weight:900;color:#0284c7;letter-spacing:1px">🔒 CONFIRMACIÓN PARA ADULTOS</p>' +
    '<h3>¿Cuánto es ' + a + ' × ' + b + '?</h3>' +
    '<p>' + (subtitle || "Resuelve esta cuenta para entrar al panel de adultos.") + '</p>' +
    '<div class="inputrow" style="margin:14px 0"><input id="adult-gate-inp" type="number" inputmode="numeric" placeholder="Respuesta" style="text-align:center;font-size:22px"></div>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="bigbtn" style="flex:1;background:#94a3b8" onclick="closeAdultGate()">Cancelar</button>' +
      '<button class="bigbtn" style="flex:1;background:#22c55e" onclick="checkAdultGate()">Entrar</button>' +
    '</div></div>';
  document.body.appendChild(bg);
  setTimeout(()=>{ const inp = document.getElementById("adult-gate-inp"); if(inp) inp.focus(); }, 80);
}
function closeAdultGate(){
  const m = document.getElementById("adult-gate-modal");
  if(m) m.remove();
}
function checkAdultGate(){
  const inp = document.getElementById("adult-gate-inp");
  const val = inp ? parseInt(inp.value, 10) : NaN;
  if(val === adultExpected){
    closeAdultGate();
    sfx.ok();
    if(adultTargetAction) adultTargetAction();
  } else {
    sfx.bad(); buzz(100);
    toast("🔒 Respuesta incorrecta. Zona para adultos.");
  }
}

// ---------- PREMIOS / DESBLOQUEOS ----------
const UNLOCKS = [
  { at:5,   id:"d1",  emoji:"🐲", label:"¡Dragón rojo amigo!", tipo:"dragon" },
  { at:8,   id:"dog", emoji:"🐶", label:"¡Perrito mascota!", tipo:"amigo" },
  { at:10,  id:"hat", emoji:"👑", label:"¡Corona para Darius!", tipo:"item" },
  { at:12,  id:"d2",  emoji:"🦕", label:"¡Dragón verde amigo!", tipo:"dragon" },
  { at:15,  id:"magohat", emoji:"🎩", label:"¡Sombrero de mago!", tipo:"item" },
  { at:18,  id:"cat", emoji:"🐱", label:"¡Gatito mascota!", tipo:"amigo" },
  { at:20,  id:"w-espacio", emoji:"🚀", label:"¡Mundo Astronauta!", tipo:"mundo", theme:"t-space" },

  { at:25,  id:"robot", emoji:"🤖", label:"¡Robot amigo!", tipo:"amigo" },

  { at:32,  id:"fones", emoji:"🎧", label:"¡Audífonos cool!", tipo:"item" },

  { at:55,  id:"dolph", emoji:"🐬", label:"¡Delfín amigo!", tipo:"amigo" },
  { at:60,  id:"w-futbol", emoji:"⚽", label:"¡Mundo Fútbol!", tipo:"mundo", theme:"t-futbol" },
  { at:65,  id:"d4",  emoji:"🐉", label:"¡Dragón dorado amigo!", tipo:"dragon" },
  { at:70,  id:"glasses", emoji:"🕶️", label:"¡Gafas de sol!", tipo:"item" },
  { at:80,  id:"w-mar", emoji:"🌊", label:"¡Mundo del Mar!", tipo:"mundo", theme:"t-mar" },
  { at:90,  id:"penguin", emoji:"🐧", label:"¡Pingüino amigo!", tipo:"amigo" },
  { at:100, id:"w-estrellas", emoji:"🌟", label:"¡Mundo de las Estrellas!", tipo:"mundo", theme:"t-estrellas" },
  { at:120, id:"wand", emoji:"🪄", label:"¡Varita mágica!", tipo:"item" },
  { at:150, id:"eleph", emoji:"🐘", label:"¡Elefantito amigo!", tipo:"amigo" },
  { at:200, id:"story", emoji:"🗝️", label:"¡Historia secreta del dragón!", tipo:"cuento" }
];
function dragonsCollection(){
  const base = ["🐉"];
  UNLOCKS.forEach(u=>{ if((u.tipo==="dragon"||u.tipo==="amigo") && S.totalStars>=u.at) base.push(u.emoji); });
  return base;
}
function addStar(n){
  const antes = S.totalStars;
  S.stars += n; S.totalStars += n; save();
  const box = document.getElementById("starcount");
  if(box){ box.textContent = S.stars; const p = box.parentElement; p.classList.remove("fly"); void p.offsetWidth; p.classList.add("fly"); }
  UNLOCKS.forEach(u=>{ if(antes < u.at && S.totalStars >= u.at){ showPrize(u); } });
}
function worldLevel(wid){ const ok = (S.worlds[wid]||{ok:0}).ok; return Math.min(4, 1 + Math.floor(ok/4)); }

function showPrize(u){
  sfx.unlock(); confetti(); buzz(200);
  const bg = document.createElement("div");
  bg.className = "modalbg";
  bg.innerHTML = '<div class="modalbox">' +
    '<p style="font-weight:900;color:#d946ef;letter-spacing:1px">🎁 ¡NUEVO PREMIO! 🎁</p>' +
    '<div class="bigemoji jump" style="margin-top:10px">' + u.emoji + '</div>' +
    '<h3>' + u.label + '</h3>' +
    (u.tipo==="mundo" ? '<p>Toca el premio en "Mis premios" para cambiar de mundo.</p>' : '') +
    '<button class="bigbtn" style="background:#22c55e;width:100%;margin-top:16px" onclick="closePrize()">🎉 ¡Genial!</button></div>';
  document.body.appendChild(bg);
  speak(u.label.replace(/[¡!🎁]/g,""));
}
function closePrize(){
  const m = document.querySelector(".modalbg");
  if(m) m.remove();
  if(navStack[navStack.length-1] && navStack[navStack.length-1].screen==="home") go("home");
}
function usePrize(u){
  const m=document.querySelector(".modalbg"); if(m) m.remove();
  S.theme = u.theme || ""; save(); applyTheme();
  toast(u.emoji + " ¡Bienvenido al nuevo mundo!");
  speak("Bienvenido a tu nuevo mundo");
  go("home");
}
function showPrizeModal(u){
  sfx.unlock();
  const bg = document.createElement("div");
  bg.className = "modalbg";
  let extra = "";
  if(u.tipo==="mundo") extra = '<button class="bigbtn" style="background:#8b5cf6;width:100%;margin-top:12px" onclick="usePrize(UNLOCKS[' + UNLOCKS.indexOf(u) + '])">🚀 ¡Viajar a este mundo!</button>';
  if(u.tipo==="cuento") extra = '<button class="bigbtn" style="background:#d946ef;width:100%;margin-top:12px" onclick="closePrize();go(\'world\',{param:\'cuentos\'})">📖 ¡Leer la historia!</button>';
  bg.innerHTML = '<div class="modalbox">' +
    '<p style="font-weight:900;color:#d946ef;letter-spacing:1px">🏆 TU PREMIO</p>' +
    '<div class="bigemoji jump" style="margin-top:10px">' + u.emoji + '</div>' +
    '<h3>' + u.label + '</h3>' +
    '<p>' + prizeDesc(u) + '</p>' + extra +
    '<button class="bigbtn" style="background:#22c55e;width:100%;margin-top:10px" onclick="closePrize()">👍 Seguir jugando</button></div>';
  document.body.appendChild(bg);
  speak(u.label.replace(/[¡!]/g,""));
}
function prizeDesc(u){
  if(u.tipo==="dragon") return "Un nuevo dragón para tu colección. Saluda contigo con el botón 🐉";
  if(u.tipo==="amigo") return "Un amigo nuevo que salta contigo con el botón 🐉";
  if(u.tipo==="item") return "Un accesorio especial para tus aventuras";
  if(u.tipo==="mundo") return "Cambia el escenario de toda la app";
  return "Un premio muy especial";
}
function applyTheme(){ document.body.className = ((S.theme||"") + (esNina()?" girl":"")).trim(); }

function renderDragonFab(){
  const el = document.getElementById("dragonfab");
  const cur = navStack[navStack.length-1];
  if(!cur || cur.screen==="dad"){ el.innerHTML=""; return; }
  el.innerHTML = '<button class="dragonbtn jump" onclick="randomDragon()" aria-label="Dragón sorpresa">🐉</button>';
}
function randomDragon(){
  sfx.tap();
  const col = dragonsCollection();
  const d = col[Math.floor(Math.random()*col.length)];
  const frases = [
    "¡Hola campeón! ¿Jugamos juntos?",
    "¡Estoy orgulloso de ti!",
    "¡Tú sí que sabes hablar!",
    "¡Las palabras son tu superpoder!",
    "¡Vamos por más estrellas, campeón!",
    "¡Eres increíble!",
    "¡Cuéntame algo de tu día!",
    "¡Yo creo en ti!",
    "¡Cada día hablas mejor que ayer!",
    "¡Eres más fuerte que un dragón!",
    "¡Sigue así, vas súper bien!",
    "¡Me encanta jugar contigo!",
    "¡Tus ideas son geniales!",
    "¡Hoy es un gran día para aprender!",
    "¡Eres un campeón de las palabras!"
  ];
  let f = frases[Math.floor(Math.random()*frases.length)];
  if(esNina()) f = f.replace(/campeón/g,"campeona").replace(/héroe/g,"heroína");
  const bg = document.createElement("div");
  bg.className = "modalbg";
  bg.innerHTML = '<div class="modalbox" onclick="closeDragon()">' +
    '<div class="bigemoji jump">' + d + '</div>' +
    '<h3 style="margin-top:14px">' + f + '</h3>' +
    '<p>Toca la pantalla para seguir jugando</p></div>';
  document.body.appendChild(bg);
  speak(f);
}
function closeDragon(){ const m=document.querySelector(".modalbg"); if(m) m.remove(); }

// ---------- MISIONES ----------
const MISSION_POOL = [
  { id:"m-siento",  label:"Di cómo te sientes",  worlds:["siento"], e:"😊" },
  { id:"m-frase",   label:"Arma una frase mágica", worlds:["necesito"], e:"🙏" },
  { id:"m-dia",     label:"Cuenta tu día",       worlds:["dia"], e:"☀️" },
  { id:"m-cuento",  label:"Lee un cuento",       worlds:["cuentos"], e:"📚" },
  { id:"m-puente",  label:"3 palabras mágicas",  worlds:["puente"], e:"⭐" },
  { id:"m-crear",   label:"Crea una historia",  worlds:["crear"], e:"✍️" },
  { id:"m-mate",    label:"Resuelve cuentas",    worlds:["mate"], e:"🔢" },
  { id:"m-eng",     label:"Aprende palabras en inglés", worlds:["english"], e:"🇬🇧" },
  { id:"m-juegos",  label:"Gana un juego arcade",  worlds:["juegos"], e:"🎮" }
];
function todaysMissions(){
  ensureToday();
  if(!S.today.missionSet || !S.today.missionSet.length){
    S.today.missionSet = MISSION_POOL.slice().sort(()=>Math.random()-0.5).slice(0,3).map(m=>m.id);
    save();
  }
  return MISSION_POOL.filter(m=>S.today.missionSet.indexOf(m.id)>=0);
}
function completeMission(worldId){
  ensureToday();
  todaysMissions().forEach(m=>{
    if(m.worlds.includes(worldId) && !S.today.missions.includes(m.id)){
      S.today.missions.push(m.id);
      const all = todaysMissions().every(m2=>S.today.missions.includes(m2.id));
      if(all){
        addStar(2); confetti(); sfx.unlock();
        S.today.missions = [];
        S.today.missionSet = [];
        toast("🎁 ¡Misiones completadas! +2 ⭐ · ¡Ya tienes NUEVAS misiones!");
      } else {
        toast("✅ ¡Misión avanzada!");
      }
      save();
    }
  });
}
function regClick(wid){ if(S.worlds[wid]) S.worlds[wid].clicks++; save(); }
function regOk(wid, label){
  if(S.worlds[wid]) S.worlds[wid].ok++;
  S.today.ok++;
  if(wid==="siento") S.today.emotions++;
  S.history.push({ t: label, w: wid, d: todayISO(), ts: Date.now() });
  if(S.history.length>200) S.history = S.history.slice(-200);
  addStar(1); sfx.ok(); buzz(60); confetti(); completeMission(wid); save();
}
function regErr(wid){ if(S.worlds[wid]) S.worlds[wid].err++; S.today.err++; save(); }

// ---------- NAVEGACIÓN ----------
let navStack = [];
function go(screen, opts){
  opts = opts || {};
  navStack.push({ screen, opts });
  const app = document.getElementById("app");
  app.innerHTML = '<div class="' + (opts.back?'screen-anim back':'screen-anim') + '">' + SCREENS[screen](opts) + '</div>';
  window.scrollTo(0,0);
  if(screen==="world") setTimeout(()=>mountWorld(opts.param), 0);
  renderNav(); renderDragonFab();
}
function goBack(){ navStack.pop(); const prev = navStack.pop(); go(prev ? prev.screen : "home", { back:true, param: prev ? prev.opts.param : undefined }); }
function renderNav(){
  const nb = document.getElementById("navbox");

}
function pickEmo(i){

    motivosAll().map((m,idx)=>'<div class="chip' + (m.custom?' newone':'') + '" style="padding:8px 4px" onclick="pickMotivo(' + idx + ')" id="mot-' + idx + '"><span class="big">' + m.emoji + '</span><span style="font-size:11px">' + m.t + '</span></div>').join("") +

function emoMotivoTexto(){
  if(emoMotivoIdx >= 0) return motivosAll()[emoMotivoIdx].t;

}
function emoFrase(){
  if(!emoSel) return "";
  const m = emoMotivoTexto();
  return "Me siento " + (emoNivel!=="normal" ? emoNivel + " " : "") + emoSel.n + (m ? ", " + m : "") + ".";
}
function pickNivel(t){
  regClick("siento"); emoNivel = t;
  NIVELES.forEach(nv=>{ const el=document.getElementById("nv-"+nv.t); if(el) el.classList.toggle("sel", nv.t===t); });
  speak("Me siento " + (t!=="normal"?t+" ":"") + emoSel.n);
  updateEmoFrase();
}
function pickMotivo(i){
  regClick("siento"); emoMotivoIdx = i; emoCustomTxt = "";
  motivosAll().forEach((m,j)=>{ const el=document.getElementById("mot-"+j); if(el) el.classList.toggle("sel", j===i); });
  speak(emoFrase());
  updateEmoFrase();
}
function usarCustomMotivo(guardar){
  regClick("siento");
  const v = (document.getElementById("emo-custom").value||"").trim();
  if(!v){ toast("✍️ Escribe tu motivo primero"); return; }
  emoCustomTxt = v; emoMotivoIdx = -1;
  if(guardar){
    S.customMotivos.push("porque " + v);
    toast("💾 ¡Guardado para siempre!");
  }
  speak(emoFrase());
  updateEmoFrase();
}
function updateEmoFrase(){
  const el = document.getElementById("emo-frase");
  el.innerHTML = '<div class="phrasebar" style="margin-top:12px"><span class="token">' + emoFrase() + '</span></div>' +
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
    '<button class="bigbtn" style="flex:1;background:#0ea5e9" onclick="speak(emoFrase())">🔊 Escuchar</button>' +
    '<button class="bigbtn" style="flex:1;background:#22c55e" onclick="finishSiento()">✅ ¡Lo dije!</button></div>';
}
function finishSiento(){
  regOk("siento", "Expresó: " + emoFrase());
  toast("⭐ ¡Bravo! Dijiste lo que sientes");
}

function aacFrase(){

      '<button class="bigbtn" style="flex:1;background:#22c55e" onclick="finishAac()">✅ ¡Lo dije!</button></div>'
    : '<div class="phrasebar"><span class="token empty">Arma tu frase tocando las imágenes…</span></div>';
}
function pickIntento(i){
  regClick("necesito");

    '</div><div id="aac-frase" style="margin-top:14px"></div>';

function pickObjeto(j){

function pickExtra(j){

}
function finishAac(){

  regOk("necesito", "Frase construida: " + aacFrase());

}

function addDia(i){
  regClick("dia");
  const a = diaAll()[i];
  diaSeq.push({ emoji:a.emoji, t:a.t });
  speak(a.t);
  renderDiaChips(); renderDiaResult();
}
function removeDia(j){
  sfx.tap(); buzz(40);
  diaSeq.splice(j,1);
  renderDiaChips(); renderDiaResult();
}
function renderDiaChips(){
  const chips = document.getElementById("dia-chips");
  chips.innerHTML = diaSeq.length ? diaSeq.map((s,j)=>{
    const con = j===0 ? "" : (j===diaSeq.length-1 && diaSeq.length>2 ? '<span class="token cony">Y</span>' : '<span class="token con">LUEGO</span>');
    return con + '<span class="token" onclick="removeDia(' + j + ')">' + s.emoji + " " + s.t + '<span class="x">✕</span></span>';
  }).join("") : '<span class="token empty">Tu historia aparece aquí…</span>';
}
function usarCustomDia(guardar){
  regClick("dia");
  const v = (document.getElementById("dia-custom").value||"").trim();
  if(!v){ toast("✍️ Escribe tu actividad primero"); return; }
  if(guardar){
    S.customDia.push({ emoji:"⭐", t:v });
    toast("💾 ¡Guardada para siempre! El dragón la leerá");
  }
  diaSeq.push({ emoji:"⭐", t:v });
  speak(v);
  renderDiaChips(); renderDiaResult();
}
function diaFrase(){
  if(!diaSeq.length) return "";
  let partes = [diaSeq[0].t];
  for(let i=1;i<diaSeq.length;i++){
    const con = i===diaSeq.length-1 && diaSeq.length>2 ? "y" : "luego";
    partes.push(con + " " + diaSeq[i].t);
  }
  return "Hoy " + partes.join(", ") + ".";
}
function renderDiaResult(){
  const el = document.getElementById("dia-result");
  if(!diaSeq.length){ el.innerHTML=""; return; }
  el.innerHTML = '<div style="margin-top:14px">' +
    '<div class="phrasebar"><span class="token">' + diaFrase() + '</span></div>' +
    '<p style="text-align:center;font-size:12px;font-weight:800;color:#9a3412;margin-top:6px">Fíjate: tus ideas se unen con LUEGO y Y 💪</p>' +
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">' +
    '<button class="bigbtn" style="flex:1;background:#0ea5e9" onclick="speak(diaFrase())">🔊 Escuchar</button>' +
    '<button class="bigbtn" style="flex:1;background:#22c55e" onclick="finishDia()">✅ Así fue mi día</button></div></div>';
}
function finishDia(){
  regOk("dia", "Contó su día (" + diaSeq.length + " acciones)");
  toast("⭐ ¡Qué bien contaste tu día!");
}

// ===== MUNDO 4: HISTORIAS =====
function cuentosHtml(){
  const lista = CUENTOS.filter(c=>!c.secreta || S.totalStars>=200).filter(c=>c.min <= S.age);
  return '<div class="card"><h2>📚 Elige una historia (' + lista.length + ')</h2>' +
    lista.map(c=>'<div class="chip" style="flex-direction:row;padding:12px;margin-bottom:8px" onclick="openCuento(\'' + c.id + '\')">' +
      '<span class="big">' + c.portada + '</span><span style="flex:1;text-align:left;font-size:15px">' + c.titulo + '</span><span style="font-size:11px;background:#fdf2f8;padding:2px 8px;border-radius:99px">' + c.escenas.length + ' escenas</span></div>').join("") +
    '</div>';
}
let cuentoActual = null, cuentoPag = 0, cuentoFinalIdx = -1;
const DYN_POOLS = {
  c: ["rojo","azul","verde","amarillo","morado","anaranjado","rosa"],
  f: ["un tesoro brillante","un cohete veloz","una pelota gigante","una torta enorme","un globo mágico","un mapa secreto"],
  a: ["perrito","gatito","conejito","osito","pajarito","zorrito"]
};
let cuentoVars = {};
function dynPrep(cuento){
  cuentoVars = {};
  const todo = JSON.stringify(cuento);
  ["c","f","a"].forEach(k=>{
    if(todo.indexOf("{" + k + "}") >= 0){
      const pool = DYN_POOLS[k];
      cuentoVars[k] = pool[Math.floor(Math.random()*pool.length)];
    }
  });
}
function dynTxt(t){ return String(t).replace(/\{([cfa])\}/g, function(m,k){ return cuentoVars[k] || ""; }); }
function openCuento(id){
  regClick("cuentos");
  cuentoActual = CUENTOS.find(c=>c.id===id);
  cuentoPag = 0; cuentoFinalIdx = -1;
  dynPrep(cuentoActual);
  renderCuentoPage();
}
function renderCuentoPage(){
  const esc = cuentoActual.escenas[cuentoPag];
  const textoEsc = dynTxt(esc.texto);
  const last = cuentoPag === cuentoActual.escenas.length - 1;
  let qHtml = "";
  if(esc.q){
    qHtml = '<div class="card" style="margin-top:12px;border:3px solid #e879f9"><h2>🤔 ' + dynTxt(esc.q.p) + '</h2>' +
      '<div class="gridbtns">' +
      esc.q.ops.map((op,i)=>'<button class="qopt" onclick="answerCuento(' + i + ')">' + dynTxt(op) + '</button>').join("") +
      '</div><div id="cuento-fb"></div></div>';
  }
  document.getElementById("worldbody").innerHTML =
    '<div class="card"><div style="text-align:center;font-weight:900;color:#9d174d;margin-bottom:6px">' + cuentoActual.portada + ' ' + cuentoActual.titulo + ' · ' + (cuentoPag+1) + '/' + cuentoActual.escenas.length + '</div>' +
    '<div class="lvlbar" style="background:#fce7f3"><i style="width:' + ((cuentoPag+1)/cuentoActual.escenas.length*100) + '%;background:#d946ef"></i></div>' +
    '<div class="scene" style="margin-top:12px">' + esc.img + '</div>' +
    '<p class="storytext">' + textoEsc + '</p>' +
    '<div class="storynav">' +
    '<button class="bigbtn" style="background:#0ea5e9" onclick="speak(' + JSON.stringify(textoEsc).replace(/"/g,'&quot;') + ')">🔊 Escuchar</button>' +
    (cuentoPag>0 ? '<button class="bigbtn" style="background:#94a3b8" onclick="cuentoPag--;renderCuentoPage()">⬅️</button>' : '') +
    (last ? '<button class="bigbtn" style="background:#22c55e" onclick="startFinalQuiz()">🏆 ¡Terminé!</button>'
          : '<button class="bigbtn" style="background:#d946ef" onclick="cuentoPag++;renderCuentoPage()">⏭️ Seguir</button>') +
    '</div></div>' + qHtml;
  setTimeout(()=>speak(textoEsc), 400);
}
function answerCuento(i){
  const esc = cuentoActual.escenas[cuentoPag];
  if(i === esc.q.c){
    regOk("cuentos", "Comprendió: " + cuentoActual.titulo);
    document.getElementById("cuento-fb").innerHTML = '<p class="feedback ok">🎉 ¡Correcto!</p>';
  } else {
    regErr("cuentos"); sfx.bad(); buzz(120);
    document.getElementById("cuento-fb").innerHTML = '<p class="feedback bad">Casi… escucha otra vez 🤔</p>';
    speak("Casi. Escucha otra vez");
  }
}
function startFinalQuiz(){
  regClick("cuentos");
  cuentoFinalIdx = 0;
  renderFinalQuiz();
}
function renderFinalQuiz(){
  const qs = cuentoActual.finalQ || [];
  if(cuentoFinalIdx >= qs.length){
    regOk("cuentos", "Terminó el cuento: " + cuentoActual.titulo);
    document.getElementById("worldbody").innerHTML =
      '<div class="card" style="text-align:center;padding:40px 16px">' +
      '<div style="font-size:70px" class="pop">🏆</div>' +
      '<h2 style="justify-content:center;margin-top:10px">¡Terminaste la historia!</h2>' +
      '<p style="font-weight:800;color:#64748b;margin:6px 0 16px">Cuéntaselo a papá con tus propias palabras. ¡Le encantará!</p>' +
      '<button class="bigbtn" style="background:#d946ef;width:100%" onclick="mountWorld(\'cuentos\')">📚 Otra historia</button></div>';
    return;
  }

let calcA = "", calcOp = "", calcB = "", calcRes = null;
function mateCalcHtml(){
  calcA=""; calcOp=""; calcB=""; calcRes=null;
  return '<div class="card"><h2>🧮 Mi calculadora</h2>' +
    '<div class="calcdisp" id="calcdisp">0</div>' +
    '<div class="calcgrid">' +
    ["7","8","9","÷","4","5","6","×","1","2","3","−","C","0","⌫","+"].map(k=>{
      const cls = "÷×−+".includes(k) ? "op" : "";
      const act = "÷×−+".includes(k) ? 'calcSetOp(\'' + (k==="÷"?"/":k==="×"?"*":k==="−"?"-":"+") + '\')' :
        k==="C" ? 'calcClear()' : k==="⌫" ? 'calcBack()' : 'calcNum(\'' + k + '\')';
      return '<button class="' + cls + '" onclick="' + act + '">' + k + '</button>';
    }).join("") +
    '<button class="eq" style="grid-column:span 4;font-size:22px" onclick="calcEq()">= ¡Cuéntalo! 🔊</button>' +
    '</div></div>';
}
function calcRender(){
  const d = document.getElementById("calcdisp");
  let txt = calcA || "0";
  if(calcOp) txt += " " + (calcOp==="*"?"×":calcOp==="/"?"÷":calcOp) + " ";
  if(calcB) txt += calcB;
  if(calcRes !== null) txt += " = " + calcRes;
  d.textContent = txt;
}
function calcNum(n){ if(calcRes!==null){calcA=String(calcRes);calcOp="";calcB="";calcRes=null;} if(!calcOp){calcA+=n;} else {calcB+=n;} calcRender(); sfx.tap(); }
function calcSetOp(o){ if(calcA){ calcOp=o; calcRes=null; } calcRender(); sfx.tap(); }
function calcClear(){ calcA="";calcOp="";calcB="";calcRes=null; calcRender(); sfx.tap(); }
function calcBack(){ if(calcB){calcB=calcB.slice(0,-1);} else if(calcOp){calcOp="";} else {calcA=calcA.slice(0,-1);} calcRender(); sfx.tap(); }
function calcEq(){
  if(!calcA || !calcOp || !calcB) return;
  const a = parseFloat(calcA), b = parseFloat(calcB);
  let r;
  if(calcOp==="+") r = a+b;
  if(calcOp==="-") r = a-b;
  if(calcOp==="*") r = a*b;
  if(calcOp==="/") r = b!==0 ? +(a/b).toFixed(2) : 0;
  calcRes = r;
  calcRender();
  const opName = calcOp==="+"?"más":calcOp==="-"?"menos":calcOp==="*"?"por":"dividido entre";
  speak(a + " " + opName + " " + b + " es igual a... " + r);
  regClick("mate");
  toast("🧮 ¡Calculado!");
}

const EN_UNIDADES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const EN_DECENAS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numToEn(n){
  n = parseInt(n,10);
  if(isNaN(n) || n<0 || n>1000000) return null;
  if(n===1000000) return "one million";
  function sub999(x){
    if(x===0) return "";
    if(x<20) return EN_UNIDADES[x];
    if(x<100) return EN_DECENAS[Math.floor(x/10)] + (x%10 ? "-" + EN_UNIDADES[x%10] : "");
    const h = Math.floor(x/100), r = x%100;
    return EN_UNIDADES[h] + " hundred" + (r ? " " + sub999(r) : "");
  }
  if(n<1000) return sub999(n) || "zero";
  const th = Math.floor(n/1000), r = n%1000;
  return (th===1 ? "one thousand" : sub999(th) + " thousand") + (r ? " " + sub999(r) : "");
}

let ENG_DICT = null, ENG_PHON = null;
const DICT_EXTRA =

  "tiburón:shark,ballena:whale,pulpo:octopus,cangrejo:crab,tortuga:turtle,delfín:dolphin," +
  "mono:monkey,gorila:gorilla,cebra:zebra,jirafa:giraffe,cocodrilo:crocodile," +
  "oveja:sheep,cabra:goat,cerdo:pig,vaca:cow,toro:bull,burro:donkey,ratón:mouse," +
  "ardilla:squirrel,zorro:fox,lobo:wolf,león:lion,hormiga:ant,araña:spider," +
  "guitarra:guitar,teléfono:phone,música:music,escuela:school,libro:book,lápiz:pencil," +
  "avión:airplane,helicóptero:helicopter,ala:wing,aeropuerto:airport,barco:ship,tren:train";

function normChildKey(s){
  return String(s||"").toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/gui/g,"gi").replace(/gue/g,"ge")
    .replace(/v/g,"b").replace(/[zsc]/g,"s")
    .replace(/ll/g,"y").replace(/h/g,"");
}
function buildEngDict(){
  if(ENG_DICT) return;
  ENG_DICT = {}; ENG_PHON = {};
  ENG_VOCAB.forEach(c=>c.items.forEach(it=>{
    ENG_DICT[it.es.toLowerCase()] = { en:it.en, es:it.es, e:it.e };
    ENG_PHON[normChildKey(it.es)] = { en:it.en, es:it.es, e:it.e };
  }));
  ENG_FRASES.forEach(f=>{
    const cleanEs = f.es.toLowerCase().replace(/[¡!¿?]/g,"").trim();
    ENG_DICT[cleanEs] = { en:f.en, es:f.es, e:f.e };
    ENG_PHON[normChildKey(cleanEs)] = { en:f.en, es:f.es, e:f.e };
  });
  DICT_EXTRA.split(",").forEach(pair=>{
    const p = pair.split(":");
    if(p.length===2){
      const es = p[0].trim(), en = p[1].trim();
      ENG_DICT[es.toLowerCase()] = { en:en, es:es, e:"🌟" };
      ENG_PHON[normChildKey(es)] = { en:en, es:es, e:"🌟" };
    }
  });
}

    '<div class="inputrow"><input id="trad-inp" placeholder="Escribe en español…" oninput="engTraducirRun()"></div>' +
    '<div id="trad-out" style="margin-top:12px"></div></div>';
}
function engTraducirRun(){

function setPizColor(c){ pizColor = c; sfx.tap(); }
function initPizarra(){
  const cvs = document.getElementById("piz-canvas");
  if(!cvs) return;
  const ctx = cvs.getContext("2d");
  let drawing = false;
  function getPos(e){
    const r = cvs.getBoundingClientRect();
    const scaleX = cvs.width / r.width;
    const scaleY = cvs.height / r.height;
    return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
  }
  cvs.onpointerdown = function(e){
    drawing = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };
  cvs.onpointermove = function(e){
    if(!drawing) return;
    const p = getPos(e);
    ctx.lineWidth = pizSize;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = pizColor;
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  window.addEventListener("pointerup", function(){ drawing = false; });
}
function clearPizarra(){
  const cvs = document.getElementById("piz-canvas");
  if(cvs) cvs.getContext("2d").clearRect(0,0,cvs.width,cvs.height);
  sfx.tap();
}

// ----- JUEGO 1: MATES MERGE 3D (ESTILO 2248 FIEL AL VIDEO) -----
const MM_COLS = 5, MM_ROWS = 8;
const MM_COLORS = { 2:"#27ae60", 4:"#2980b9", 8:"#d35400", 16:"#c2185b", 32:"#7b1fa2", 64:"#7f1d1d", 128:"#512da8", 256:"#1f618d", 512:"#0e7490", 1024:"#b45309", 2048:"#be123c", 4096:"#9d174d", 8192:"#4338ca" };
let mmBoard = [], mmChain = [], mmDragging = false, mmScore = 0, mmRecord = 64, mmSmash = false;

function mmRandVal(){
  const pool = [2, 4, 8, 16];
  return pool[Math.floor(Math.random()*pool.length)];
}
function renderMatesMerge(container){
  if(!mmBoard.length){
    for(let r=0;r<MM_ROWS;r++){
      const row = [];
      for(let c=0;c<MM_COLS;c++) row.push(mmRandVal());
      mmBoard.push(row);
    }
  }
  container.innerHTML = '<div class="card" style="background:#0d152c;color:#fff;border-color:#25386b">' +
    '<h2 style="color:#fff;justify-content:center">🔢 Mates Merge · une números con el dedo</h2>' +
    '<div class="mm-hud">' +
      '<div class="mm-pill">⭐ Estrellas: <span id="mm-stars">' + S.stars + '</span></div>' +
      '<div class="mm-score" id="mm-score">' + mmScore + '</div>' +
      '<div class="mm-pill">👑 Récord: <span id="mm-rec">' + mmRecord + '</span></div>' +
    '</div>' +
    '<div class="mm-goalbar">' +
      '<div class="mm-goalline"></div>' +
      '<div class="mm-minitile val2">2</div>' +
      '<div class="mm-minitile center val' + Math.min(8192,mmRecord) + '" id="mm-preview">' + mmRecord + '</div>' +
      '<div class="mm-minitile val' + Math.min(8192,mmRecord*2) + '" id="mm-goal"><small>META</small><span id="mm-goaltxt">' + (mmRecord*2) + '</span></div>' +
    '</div>' +
    '<div id="mm-board">' +
      '<svg id="mm-svg"><polyline id="mm-line-bg" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><polyline id="mm-line" fill="none" stroke="#27ae60" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<div class="mm-grid" id="mm-grid"></div>' +
    '</div>' +
    '<div class="mm-powers">' +
      '<button class="mm-power" id="mm-smash-btn" onclick="mmToggleSmash()">🔨 Martillo<small>Rompe 1 ficha</small></button>' +
      '<button class="mm-power" onclick="mmResetBoard()">🔄 Nuevo Tablero<small>Reiniciar</small></button>' +
    '</div>' +
    '<p style="text-align:center;font-size:12px;color:#94a3b8;margin-top:8px;font-weight:800">Mantén apretado y traza la línea: las 2 primeras fichas iguales y luego iguales o el doble (ej: 2 → 2 → 4 → 8).</p>' +
  '</div>';
  mmDrawGrid();
  const bEl = document.getElementById("mm-board");
  if(bEl){
    bEl.onpointermove = function(e){
      if(!mmDragging) return;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      if(!target) return;
      const tile = target.closest(".mmtile");
      if(tile) mmEnterTile(parseInt(tile.dataset.r,10), parseInt(tile.dataset.c,10));
    };
  }
}
function mmCalcResult(){
  if(mmChain.length < 2) return 0;
  const sum = mmChain.reduce((acc, p)=>acc + mmBoard[p.r][p.c], 0);
  let p = 2;
  while(p < sum) p *= 2;
  return p;
}
function mmDrawGrid(mergedPos, droppedCols){
  const g = document.getElementById("mm-grid");
  if(!g) return;
  g.innerHTML = "";
  const highest = Math.max.apply(null, mmBoard.reduce((a,b)=>a.concat(b), []));
  for(let r=0;r<MM_ROWS;r++){
    for(let c=0;c<MM_COLS;c++){
      const v = mmBoard[r][c];
      const d = document.createElement("div");
      d.className = "mmtile val" + Math.min(8192, v);
      if(v === highest && v >= 32) d.classList.add("king");
      if(mergedPos && mergedPos.r===r && mergedPos.c===c) d.classList.add("pop-anim");
      else if(droppedCols && droppedCols.has(c)) d.classList.add("drop-anim");
      d.dataset.r = r; d.dataset.c = c;
      d.innerHTML = '<span class="mmtxt">' + v + '</span>';
      d.onpointerdown = function(ev){ ev.preventDefault(); mmStartTile(r, c); };
      d.onpointerenter = function(){ mmEnterTile(r, c); };
      g.appendChild(d);
    }
  }
}
function mmStartTile(r, c){
  if(mmSmash){
    for(let row=r; row>0; row--) mmBoard[row][c] = mmBoard[row-1][c];
    mmBoard[0][c] = mmRandVal();
    mmSmash = false;
    const btn = document.getElementById("mm-smash-btn");
    if(btn) btn.classList.remove("active-mode");
    sfx.ok();
    mmDrawGrid(null, new Set([c]));
    return;
  }
  mmDragging = true;
  mmChain = [{r:r, c:c}];
  tone(280, 0.08, 0, "sine", 0.14);
  mmUpdateTrace();
}
function mmEnterTile(r, c){
  if(!mmDragging) return;
  const last = mmChain[mmChain.length-1];
  if(last.r===r && last.c===c) return;
  if(mmChain.length >= 2){
    const prev = mmChain[mmChain.length-2];
    if(prev.r===r && prev.c===c){
      mmChain.pop();
      tone(260 + mmChain.length*38, 0.07, 0, "sine", 0.12);
      mmUpdateTrace();
      return;
    }
  }
  if(mmChain.some(p=>p.r===r && p.c===c)) return;
  if(Math.abs(last.r - r) > 1 || Math.abs(last.c - c) > 1) return;
  const cand = mmBoard[r][c], prevVal = mmBoard[last.r][last.c];
  const valid = (mmChain.length === 1) ? (cand === prevVal) : (cand === prevVal || cand === prevVal * 2);
  if(valid){
    mmChain.push({r:r, c:c});
    tone(280 + mmChain.length*42, 0.08, 0, "sine", 0.15);
    mmUpdateTrace();
  }
}
function mmUpdateTrace(){
  document.querySelectorAll(".mmtile").forEach(el=>{
    const r = parseInt(el.dataset.r,10), c = parseInt(el.dataset.c,10);
    el.classList.toggle("sel", mmChain.some(p=>p.r===r && p.c===c));
  });
  const boardEl = document.getElementById("mm-board");
  if(!boardEl) return;
  const bRect = boardEl.getBoundingClientRect();
  const pts = mmChain.map(p=>{
    const t = document.querySelector('.mmtile[data-r="' + p.r + '"][data-c="' + p.c + '"]');
    if(!t) return "0,0";
    const tr = t.getBoundingClientRect();
    return (tr.left - bRect.left + tr.width/2) + "," + (tr.top - bRect.top + tr.height/2);
  }).join(" ");
  const l1 = document.getElementById("mm-line");
  const l2 = document.getElementById("mm-line-bg");
  if(l1) l1.setAttribute("points", pts);
  if(l2) l2.setAttribute("points", pts);
  if(mmChain.length >= 1){
    const previewVal = mmChain.length >= 2 ? mmCalcResult() : mmBoard[mmChain[0].r][mmChain[0].c];
    if(l1) l1.setAttribute("stroke", MM_COLORS[previewVal] || "#27ae60");
    const prevEl = document.getElementById("mm-preview");
    if(prevEl){
      prevEl.textContent = previewVal;
      prevEl.className = "mm-minitile center val" + Math.min(8192, previewVal);
    }
  }
}
window.addEventListener("pointerup", function(){
  if(!mmDragging) return;
  mmDragging = false;
  if(mmChain.length >= 2){
    const resVal = mmCalcResult();
    const dest = mmChain[mmChain.length-1];
    const cols = new Set(mmChain.map(p=>p.c));
    const len = mmChain.length;

    mmChain.slice(0,-1).forEach(p=>{ mmBoard[p.r][p.c] = null; });
    mmBoard[dest.r][dest.c] = resVal;

    cols.forEach(c=>{
      const surv = [];
      for(let r=MM_ROWS-1; r>=0; r--){
        if(mmBoard[r][c] !== null) surv.push(mmBoard[r][c]);
      }
      while(surv.length < MM_ROWS) surv.push(mmRandVal());
      for(let r=MM_ROWS-1, i=0; r>=0; r--, i++) mmBoard[r][c] = surv[i];
    });

    mmScore += resVal;
    sfx.ok();
    const scEl = document.getElementById("mm-score");
    if(scEl) scEl.textContent = mmScore;

    if(resVal > mmRecord){
      mmRecord = resVal;
      regOk("juegos", "Récord en Mates Merge: " + resVal);
      speak("¡Nuevo récord! Llegaste al " + resVal);
    } else if(len >= 5){
      regOk("juegos", "Combo x" + len + " en Mates Merge");
      speak("¡Combo de " + len + " fichas! Subes al " + resVal);
    }

    const recEl = document.getElementById("mm-rec");
    if(recEl) recEl.textContent = mmRecord;
    const goalTxt = document.getElementById("mm-goaltxt");
    if(goalTxt) goalTxt.textContent = mmRecord * 2;

    mmChain = [];
    const l1 = document.getElementById("mm-line"), l2 = document.getElementById("mm-line-bg");
    if(l1) l1.setAttribute("points","");
    if(l2) l2.setAttribute("points","");
    mmDrawGrid(dest, cols);
  } else {
    mmChain = [];
    mmUpdateTrace();
  }
});
function mmToggleSmash(){
  mmSmash = !mmSmash;
  const btn = document.getElementById("mm-smash-btn");
  if(btn) btn.classList.toggle("active-mode", mmSmash);
}
function mmResetBoard(){
  mmBoard = []; mmScore = 0;
  mountJuegoActivo();
}

    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0">' +
      shuffled.map(s=>'<button class="bigbtn" style="background:#8b5cf6;font-size:22px;padding:12px 22px" onclick="pickSilaba(\'' + s + '\')">' + s + '</button>').join("") +
    '</div>' +
    '<div class="phrasebar" id="sil-bar" style="margin:12px 0;font-size:22px;font-weight:900;color:#6d28d9">…</div>' +
    '<div class="inputrow" style="max-width:340px;margin:10px auto">' +
      '<input id="sil-inp" placeholder="O escríbela aquí como te salga…" style="text-align:center">' +
    '</div>' +
    '<div style="display:flex;gap:8px;justify-content:center">' +
      '<button class="bigbtn" style="background:#22c55e" onclick="checkSilabaEscrita()">✅ Comprobar escritura</button>' +
      '<button class="bigbtn" style="background:#0ea5e9" onclick="silIdx++;mountJuegoActivo()">⏭️ Otra palabra</button>' +
    '</div>' +
    '<div id="sil-fb"></div></div>';
}
function pickSilaba(s){
  const item = SILABAS_WORDS[silIdx % SILABAS_WORDS.length];
  silPicked.push(s);
  sfx.tap();
  document.getElementById("sil-bar").textContent = silPicked.join(" - ");
  if(silPicked.join("") === item.w){
    regOk("juegos", "Armó por sílabas: " + item.w);
    document.getElementById("sil-fb").innerHTML = '<p class="feedback ok">🎉 ¡Excelente! ' + item.s.join(" - ") + '</p>';
    speak("¡Excelente! " + item.w);
  } else if(silPicked.length >= item.s.length){
    sfx.bad();
    silPicked = [];
    setTimeout(()=>{ const b=document.getElementById("sil-bar"); if(b) b.textContent="Intenta de nuevo…"; }, 500);
  }
}
function checkSilabaEscrita(){
  const item = SILABAS_WORDS[silIdx % SILABAS_WORDS.length];
  const raw = (document.getElementById("sil-inp").value||"").trim();
  if(!raw) return;
  const fb = document.getElementById("sil-fb");
  if(raw.toLowerCase() === item.w.toLowerCase()){
    regOk("juegos", "Escribió perfecto: " + item.w);
    fb.innerHTML = '<p class="feedback ok">🎉 ¡Lo escribiste perfecto con todas sus letras: <b>' + item.s.join("-") + '</b>!</p>';
    speak("¡Perfecto! " + item.w);
  } else if(normChildKey(raw) === normChildKey(item.w)){
    regOk("juegos", "Escribió (con apoyo): " + item.w);
    fb.innerHTML = '<p class="feedback ok">🌟 ¡Muy bien! Se entiende genial. Recuerda su secreto mágico: se escribe <b>' + item.s.join(" - ") + '</b> (' + item.tip + ')</p>';
    speak("¡Muy bien! " + item.tip);
  } else {
    sfx.bad();
    fb.innerHTML = '<p class="feedback bad">Mira las sílabas moradas de arriba para guiarte 🤔</p>';
  }
}

// ----- JUEGO 3: CAZADOR DE SUMAS -----
let csTimer = null;
function csStop(){ if(csTimer){ clearInterval(csTimer); csTimer = null; } }
function renderCazadorSumas(container){
  const a = 1 + Math.floor(Math.random()*6), b = 1 + Math.floor(Math.random()*6);
  const ans = a + b;
  const ops = [ans, ans+1, ans+2, Math.max(1, ans-1)].sort(()=>Math.random()-0.5);
  container.innerHTML = '<div class="card" style="text-align:center">' +
    '<h2>🎈 Cazador de Sumas · Toca el globo correcto</h2>' +
    '<div class="mathprob">' + a + ' + ' + b + ' = ?</div>' +
    '<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:16px 0">' +
      ops.map(o=>'<button class="bigbtn floaty" style="width:82px;height:96px;border-radius:50%;font-size:26px;background:#f43f5e" onclick="csCheck(' + o + ',' + ans + ')">🎈<br>' + o + '</button>').join("") +
    '</div><div id="cs-fb"></div></div>';
}
function csCheck(o, ans){
  const fb = document.getElementById("cs-fb");
  if(o === ans){
    regOk("juegos", "Cazador de sumas");
    if(fb) fb.innerHTML = '<p class="feedback ok">🎉 ¡Globo atrapado!</p>';
    setTimeout(mountJuegoActivo, 1100);
  } else {
    sfx.bad();
    if(fb) fb.innerHTML = '<p class="feedback bad">¡Sigue intentando! 🎈</p>';
  }
}

// ----- JUEGO 4: TORRE DE MATES -----
let torrePisos = 1;
function renderTorreMates(container){
  const a = 1 + Math.floor(Math.random()*5), b = 1 + Math.floor(Math.random()*5);
  const ans = a + b;
  const ops = [ans, ans+1, Math.max(1, ans-1)].sort(()=>Math.random()-0.5);
  let towerBlocks = "";
  for(let i=0;i<torrePisos;i++){
    towerBlocks += '<div style="background:linear-gradient(90deg,#f59e0b,#eab308);color:#fff;font-weight:900;padding:6px;border-radius:10px;width:' + Math.max(40, 90 - i*6) + '%;margin:3px auto">🏢 Piso ' + (torrePisos - i) + '</div>';
  }
  container.innerHTML = '<div class="card" style="text-align:center">' +
    '<h2>🏗️ Torre de Mates · Piso ' + torrePisos + '</h2>' +
    '<div style="min-height:90px;padding:10px">' + towerBlocks + '</div>' +
    '<div class="mathprob">' + a + ' + ' + b + ' = ?</div>' +
    '<div class="gridbtns" style="grid-template-columns:repeat(3,1fr)">' +
      ops.map(o=>'<button class="qopt" style="font-size:22px" onclick="torreCheck(' + o + ',' + ans + ')">' + o + '</button>').join("") +
    '</div></div>';
}
function torreCheck(o, ans){
  if(o === ans){
    torrePisos++;
    regOk("juegos", "Torre de Mates piso " + torrePisos);
    mountJuegoActivo();
  } else {
    sfx.bad(); toast("🏗️ ¡Casi se mueve la torre, prueba otro!");
  }
}

// ----- JUEGO 5: LLUVIA DE PALABRAS -----
let llTimer = null;
function llStop(){ if(llTimer){ clearInterval(llTimer); llTimer = null; } }
function renderLluviaPalabras(container){
  const palabras = [
    { e:"🐶", w:"perro" }, { e:"🐱", w:"gato" }, { e:"🌞", w:"sol" },
    { e:"🌙", w:"luna" }, { e:"🎸", w:"guitarra" }, { e:"☎️", w:"teléfono" }
  ];
  const target = palabras[Math.floor(Math.random()*palabras.length)];
  const ops = [target].concat(palabras.filter(x=>x.w!==target.w).sort(()=>Math.random()-0.5).slice(0,2)).sort(()=>Math.random()-0.5);
  speak("Atrapa la palabra " + target.w);
  container.innerHTML = '<div class="card" style="text-align:center">' +
    '<h2>🌧️ Lluvia de Palabras · Toca: <b>' + target.e + ' ' + target.w.toUpperCase() + '</b></h2>' +
    '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:20px 0">' +
      ops.map(o=>'<button class="bigbtn floaty" style="background:#0ea5e9;font-size:20px;padding:16px 22px" onclick="llCheck(\'' + o.w + '\',\'' + target.w + '\')">☁️ ' + o.w + '</button>').join("") +
    '</div></div>';
}
function llCheck(w, target){
  if(w === target){
    regOk("juegos", "Atrapó la palabra: " + w);
    setTimeout(mountJuegoActivo, 900);
  } else {
    sfx.bad();
  }
}

// ----- JUEGO 6: MEMORAMA -----
let memoCards = [], memoFlipped = [], memoMatched = [];
function renderMemorama(container){
  if(memoCards.length === 0 || memoMatched.length === memoCards.length){
    const icons = ["🐶","🐱","🐲","🦖","🦄","🚀"];
    memoCards = icons.concat(icons).sort(()=>Math.random()-0.5);
    memoFlipped = []; memoMatched = [];
  }
  container.innerHTML = '<div class="card" style="text-align:center">' +
    '<h2>🃏 Memorama · Encuentra los pares</h2>' +
    '<div class="gridbtns" style="grid-template-columns:repeat(4,1fr);max-width:420px;margin:0 auto">' +
      memoCards.map((ic, idx)=>{
        const open = memoFlipped.includes(idx) || memoMatched.includes(idx);
        return '<button class="chip" style="height:76px;font-size:34px;background:' + (open?'#fef9c3':'#334155') + ';color:#fff" onclick="memoTap(' + idx + ')">' + (open ? ic : '❓') + '</button>';
      }).join("") +
    '</div></div>';
}
function memoTap(idx){
  if(memoFlipped.length >= 2 || memoFlipped.includes(idx) || memoMatched.includes(idx)) return;
  sfx.tap();
  memoFlipped.push(idx);
  mountJuegoActivo();
  if(memoFlipped.length === 2){
    const a = memoFlipped[0], b = memoFlipped[1];
    if(memoCards[a] === memoCards[b]){
      memoMatched.push(a, b);
      memoFlipped = [];
      sfx.ok();
      if(memoMatched.length === memoCards.length){
        regOk("juegos", "Completó el Memorama");
        toast("🏆 ¡Memorama completado!");
      }
      setTimeout(mountJuegoActivo, 400);
    } else {
      setTimeout(()=>{ memoFlipped = []; mountJuegoActivo(); }, 750);
    }
  }
}

// ----- JUEGO 7: BURBUJAS QUE SUMAN -----
function renderBurbujas(container){
  const target = 4 + Math.floor(Math.random()*7);
  const a = Math.floor(target/2), b = target - a;
  const ops = [
    { txt: a + " + " + b, ok:true },
    { txt: (a+1) + " + " + (b+1), ok:false },
    { txt: Math.max(1,a-1) + " + " + b, ok:false }
  ].sort(()=>Math.random()-0.5);
  container.innerHTML = '<div class="card" style="text-align:center">' +
    '<h2>🫧 Burbujas que Suman · ¿Cuál da <b>' + target + '</b>?</h2>' +
    '<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:18px 0">' +
      ops.map(o=>'<button class="bigbtn floaty" style="background:#06b6d4;border-radius:99px;font-size:22px;padding:20px 26px" onclick="burbujaTap(' + o.ok + ')">🫧 ' + o.txt + '</button>').join("") +
    '</div></div>';
}
function burbujaTap(isOk){
  if(isOk){
    regOk("juegos", "Burbujas que suman");
    setTimeout(mountJuegoActivo, 900);
  } else {
    sfx.bad();
  }
}

// ===== MODO PAPÁ (PANEL PARENTAL COMPLETO) =====

  }).join("");

  return '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
      '<h2>👨‍👩‍👦 Panel para Adultos (Modo Papá)</h2>' +
      '<button class="bigbtn" style="background:#0ea5e9;padding:8px 16px" onclick="go(\'home\')">🏠 Volver al juego</button>' +
    '</div>' +
    '<div class="statgrid">' +
      '<div class="stat"><b>' + S.totalStars + '</b><small>Estrellas totales</small></div>' +
      '<div class="stat"><b>' + Math.round(S.today.minutes) + ' min</b><small>Tiempo hoy</small></div>' +
      '<div class="stat"><b>' + S.today.ok + '</b><small>Logros hoy</small></div>' +
    '</div>' +
    '<h2>👶 Nombre, edad y modo</h2>' +
    '<div class="inputrow" style="margin-bottom:8px"><input id="dad-name" value="' + S.name + '" onchange="S.name=this.value||\'Darius\';save();toast(\'Nombre actualizado\')"></div>' +
    '<div class="agebtns">' +
      [3,4,5,6,7,8].map(a=>'<button class="' + (S.age===a?'sel':'') + '" onclick="S.age=' + a + ';save();go(\'dad\',{back:true})">' + a + ' años</button>').join("") +
      '<button class="' + (!esNina()?'sel':'') + '" onclick="setGenero(\'nino\')">👦 Niño</button>' +
      '<button class="' + (esNina()?'sel':'') + '" onclick="setGenero(\'nina\')">👧 Niña</button>' +
    '</div>' +
    '<h2 style="margin-top:14px">📊 Progreso por mundo</h2>' +

    '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="bigbtn" style="background:#ef4444;flex:1" onclick="resetProgressConfirm()">🗑️ Reiniciar progreso a cero</button>' +
    '</div>' +
  '</div>';
};

function resetProgressConfirm(){
  askAdultConfirmation(function(){
    localStorage.removeItem("gdpro2");
    S = JSON.parse(JSON.stringify(DEFAULT_STATE));
    save();
    toast("Progreso reiniciado a cero");
    go("home");
  }, "Confirma la multiplicación para borrar todo el progreso.");
}
