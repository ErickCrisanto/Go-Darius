<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GO DARIUS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { background:linear-gradient(180deg,#7dd3fc 0%, #a5b4fc 45%, #f9a8d4 100%); min-height:100vh; color:#1e293b; transition:background 1s; }
  body.t-space { background:linear-gradient(180deg,#0f172a 0%, #1e1b4b 50%, #4c1d95 100%); }
  body.t-bruja { background:linear-gradient(180deg,#4c1d95 0%, #6d28d9 45%, #312073 100%); }
  body.t-escuela { background:linear-gradient(180deg,#fbbf24 0%, #f97316 45%, #fca5a5 100%); }
  body.t-neon { background:linear-gradient(180deg,#0c0a1e 0%, #2e1065 45%, #155e75 100%); }
  body.t-futbol { background:linear-gradient(180deg,#16a34a 0%, #22c55e 45%, #86efac 100%); }
  body.t-mar { background:linear-gradient(180deg,#0891b2 0%, #0ea5e9 45%, #67e8f9 100%); }
  body.girl { background:linear-gradient(180deg,#fce7f3 0%, #e9d5ff 45%, #fbcfe8 100%); }
  body.girl .card { border-color:#f9a8d4; }
  body.girl .wemoji, body.girl .avatar { filter:hue-rotate(280deg) saturate(1.2); }
  body.girl .bigbtn, body.girl .qopt { background:#ec4899; }
  body.girl .tabbtns button.sel { background:#db2777; border-color:#db2777; }
  body.t-estrellas { background:linear-gradient(180deg,#1e1b4b 0%, #312e81 40%, #7c3aed 100%); }
  #app { max-width:520px; margin:0 auto; padding:14px 14px 90px; position:relative; }

  @keyframes screenIn { from { opacity:0; transform:translateX(40px) scale(.98);} to { opacity:1; transform:none;} }
  @keyframes screenInBack { from { opacity:0; transform:translateX(-40px) scale(.98);} to { opacity:1; transform:none;} }
  @keyframes pop { 0%{transform:scale(.5);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes jump { 0%,100%{transform:translateY(0) scale(1)} 30%{transform:translateY(-30px) scale(1.05)} 60%{transform:translateY(0) scale(.96)} }
  @keyframes wiggle { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:.6; } }
  @keyframes starfly { 0%{transform:scale(1)} 50%{transform:scale(1.6) rotate(15deg)} 100%{transform:scale(1)} }
  @keyframes shine { 0%,100%{filter:drop-shadow(0 0 0 gold)} 50%{filter:drop-shadow(0 0 12px gold)} }
  @keyframes progress { from { width:0 } }
  @keyframes zoombg { from{opacity:0; transform:scale(.5)} to{opacity:1; transform:scale(1)} }
  .screen-anim { animation:screenIn .35s cubic-bezier(.2,.8,.3,1); }
  .screen-anim.back { animation:screenInBack .35s cubic-bezier(.2,.8,.3,1); }
  .pop { animation:pop .3s ease-out; }
  .floaty { animation:floaty 3s ease-in-out infinite; }
  .jump { animation:jump 1s ease-in-out infinite; }

  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .avatar { width:58px; height:58px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:32px; border:3px solid #fbbf24; box-shadow:0 4px 12px rgba(0,0,0,.15); position:relative; flex-shrink:0; }
  .avatar .hat { position:absolute; top:-14px; font-size:20px; }
  .hello { flex:1; min-width:0; }
  .hello h1 { font-size:20px; font-weight:900; color:#312e81; text-shadow:0 1px 0 rgba(255,255,255,.5); }
  body.t-space .hello h1, body.t-neon .hello h1, body.t-estrellas .hello h1 { color:#c7d2fe; text-shadow:none; }
  .hello .lvlbadge { display:inline-block; background:#fbbf24; color:#7c2d12; font-weight:900; font-size:11px; padding:2px 10px; border-radius:99px; margin-top:2px; }
  .starbox { background:#fff; border-radius:99px; padding:6px 14px; font-weight:900; font-size:18px; display:flex; align-items:center; gap:5px; box-shadow:0 3px 10px rgba(0,0,0,.12); }
  .starbox.fly { animation:starfly .6s ease; }
  .starbox .st { font-size:20px; animation:shine 2.5s infinite; }
  .dragonbtn { position:fixed; bottom:16px; right:14px; z-index:110; width:62px; height:62px; border:none; border-radius:50%; background:#fff; font-size:32px; box-shadow:0 6px 18px rgba(0,0,0,.28); cursor:pointer; border:3px solid #fbbf24; }
  .dragonbtn:active { transform:scale(.88); }

  .card { background:rgba(255,255,255,.96); border-radius:22px; padding:16px; box-shadow:0 6px 20px rgba(56,50,150,.18); margin-bottom:14px; }
  body.t-space .card, body.t-neon .card, body.t-estrellas .card { background:rgba(30,41,59,.92); color:#f1f5f9; }
  .card h2 { font-size:16px; font-weight:900; margin-bottom:8px; color:#312e81; display:flex; align-items:center; gap:6px; }
  body.t-space .card h2, body.t-neon .card h2, body.t-estrellas .card h2 { color:#a5b4fc; }

  .mission-item { display:flex; align-items:center; gap:10px; padding:9px 4px; font-weight:800; font-size:15px; }
  .mission-item .mcheck { width:28px; height:28px; border-radius:10px; border:3px solid #cbd5e1; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; background:#fff; }
  .mission-item.done .mcheck { background:#22c55e; border-color:#22c55e; color:#fff; }
  .mission-item.done span { text-decoration:line-through; opacity:.55; }
  .giftrow { display:flex; align-items:center; gap:10px; margin-top:8px; background:#fef9c3; border-radius:14px; padding:10px 14px; font-weight:900; color:#854d0e; }
  .giftrow.ready { background:#22c55e; color:#fff; animation:wiggle 1s infinite; }

  .map { position:relative; padding:6px 0 20px; }
  .map::before { content:''; position:absolute; left:50%; top:0; bottom:0; width:0; border-left:4px dotted rgba(255,255,255,.75); transform:translateX(-2px); z-index:0; }
  body.t-space .map::before, body.t-neon .map::before { border-left-color:rgba(165,180,252,.5); }
  .world { position:relative; z-index:1; width:82%; border:none; border-radius:24px; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; margin-bottom:18px; box-shadow:0 6px 16px rgba(0,0,0,.18); transition:transform .15s; text-align:left; }
  .world:active { transform:scale(.96); }
  .world:nth-child(odd) { margin-left:auto; margin-right:8%; }
  .world:nth-child(even) { margin-right:auto; margin-left:8%; }
  .world .wemoji { font-size:38px; flex-shrink:0; }
  .world .winfo { flex:1; color:#fff; }
  .world .winfo b { display:block; font-size:17px; font-weight:900; text-shadow:0 1px 2px rgba(0,0,0,.25); }
  .world .winfo small { font-size:11px; font-weight:800; opacity:.92; }
  .world .wstars { font-size:12px; background:rgba(0,0,0,.28); padding:3px 9px; border-radius:99px; font-weight:900; }
  .lvlbar { height:8px; background:rgba(0,0,0,.25); border-radius:99px; margin-top:5px; overflow:hidden; }
  .lvlbar i { display:block; height:100%; background:#fde047; border-radius:99px; }

  .bigbtn { border:none; border-radius:20px; padding:14px; font-size:16px; font-weight:900; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.18); transition:transform .1s, box-shadow .1s; color:#fff; }
  .bigbtn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  .gridbtns { display:grid; gap:10px; }
  .chip { border:3px solid #fff; background:rgba(255,255,255,.75); border-radius:18px; padding:12px 8px; font-weight:900; font-size:13px; text-align:center; cursor:pointer; transition:transform .1s; display:flex; flex-direction:column; align-items:center; gap:6px; color:#1e293b; }
  .chip:active { transform:scale(.93); }
  .chip.sel { background:#fbbf24; border-color:#f59e0b; }
  .chip .big { font-size:38px; line-height:1; }
  .chip.newone { border-style:dashed; border-color:#22c55e; background:#f0fdf4; }

  .phrasebar { background:#fffbeb; border:3px dashed #f59e0b; border-radius:18px; padding:12px; min-height:60px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; }
  .token { background:#f59e0b; color:#fff; font-weight:900; padding:6px 12px; border-radius:99px; font-size:15px; animation:pop .25s; cursor:pointer; }
  .token.con { background:#f97316; } .token.cony { background:#8b5cf6; }
  .token .x { opacity:.7; font-size:11px; margin-left:3px; }
  .token.empty { background:#e2e8f0; color:#94a3b8; cursor:default; }

  .scene { background:linear-gradient(180deg,#fce7f3,#e9d5ff); border-radius:20px; padding:24px 10px; text-align:center; font-size:56px; line-height:1.15; margin-bottom:12px; min-height:140px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px; }
  .storytext { font-size:21px; font-weight:900; text-align:center; line-height:1.45; padding:0 6px; }
  .storynav { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .qopt { width:100%; border:3px solid #fff; background:#fae8ff; border-radius:16px; padding:13px; font-size:17px; font-weight:900; cursor:pointer; color:#6b21a8; }
  .qopt:active { transform:scale(.97); }

  .feedback { text-align:center; font-size:21px; font-weight:900; padding:10px; animation:pop .3s; }
  .ok { color:#16a34a; } .bad { color:#e11d48; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:300; background:#1e293b; color:#fff; font-weight:900; padding:12px 22px; border-radius:99px; font-size:15px; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:pop .3s; max-width:90vw; text-align:center; }
  .confetti { position:fixed; top:-40px; z-index:250; font-size:26px; pointer-events:none; animation:fall 2.2s linear forwards; }

  .navrow { position:fixed; top:12px; left:12px; z-index:100; display:flex; gap:8px; }
  .navrow button { width:46px; height:46px; border:none; border-radius:50%; background:rgba(255,255,255,.95); font-size:22px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.2); }
  .navrow button:active { transform:scale(.9); }
  .dadbtn { display:block; margin:0 auto 20px; border:none; border-radius:99px; padding:13px 30px; background:#334155; color:#fff; font-weight:900; font-size:15px; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.25); }

  .statgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:linear-gradient(180deg,#eff6ff,#dbeafe); border-radius:16px; padding:10px 4px; text-align:center; }
  .stat b { font-size:22px; display:block; color:#1d4ed8; }
  .stat small { font-size:10px; font-weight:800; color:#475569; }
  .weekbar { margin:8px 0; }
  .weekbar .wlabel { display:flex; justify-content:space-between; font-size:12px; font-weight:900; margin-bottom:3px; }
  .weekbar .wtrack { height:12px; background:#e2e8f0; border-radius:99px; overflow:hidden; }
  .weekbar .wfill { height:100%; border-radius:99px; animation:progress .8s ease-out; }
  table.stats { width:100%; border-collapse:collapse; font-size:13px; margin:10px 0; }
  table.stats th { text-align:left; color:#64748b; font-size:11px; border-bottom:2px solid #e2e8f0; padding:4px 2px; }
  table.stats td { font-weight:800; padding:5px 2px; border-bottom:1px solid #f1f5f9; }
  .tipbox { background:#e0f2fe; border-left:5px solid #0284c7; border-radius:10px; padding:10px 12px; font-size:13px; font-weight:700; color:#0c4a6e; margin:8px 0; }
  .warnbox { background:#fef2f2; border-left:5px solid #dc2626; border-radius:10px; padding:10px 12px; font-size:13px; font-weight:700; color:#7f1d1d; margin:8px 0; }
  .inputrow input, .inputrow textarea { width:100%; border:2px solid #cbd5e1; border-radius:12px; padding:11px; font-size:15px; font-weight:700; font-family:inherit; }
  .agebtns { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .agebtns button { border:3px solid #e2e8f0; background:#fff; border-radius:99px; padding:8px 14px; font-weight:900; cursor:pointer; }
  .agebtns button.sel { background:#0ea5e9; border-color:#0284c7; color:#fff; }

  .dragontip { display:flex; gap:10px; align-items:center; background:rgba(255,255,255,.9); border-radius:18px; padding:10px 14px; margin-bottom:14px; box-shadow:0 4px 14px rgba(0,0,0,.12); }
  .dragontip .dem { font-size:30px; flex-shrink:0; }
  .dragontip p { font-size:13px; font-weight:800; color:#4c1d95; }
  .unlockrow { display:flex; align-items:center; gap:10px; padding:8px 4px; font-weight:800; font-size:14px; }
  .unlockrow.locked2 { opacity:.45; }
  .unlockrow.won { cursor:pointer; border-radius:12px; }
  .unlockrow.won:active { background:#f1f5f9; }
  .sectiontitle { font-size:14px; font-weight:900; color:#fff; margin:18px 4px 8px; letter-spacing:.5px; text-shadow:0 1px 2px rgba(0,0,0,.2); }

  /* Modal premios / dragón */
  .modalbg { position:fixed; inset:0; background:rgba(15,23,42,.75); z-index:400; display:flex; align-items:center; justify-content:center; animation:pop .25s; }
  .modalbox { background:#fff; border-radius:28px; padding:28px 20px; text-align:center; max-width:85vw; width:340px; animation:zoombg .5s cubic-bezier(.2,.8,.3,1.4); box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .modalbox .bigemoji { font-size:84px; line-height:1; }
  .modalbox h3 { font-size:22px; font-weight:900; color:#312e81; margin-top:10px; }
  .modalbox p { font-weight:800; color:#64748b; margin-top:4px; font-size:14px; }

  .tabbtns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tabbtns button { border:3px solid #e2e8f0; background:#fff; border-radius:99px; padding:8px 13px; font-weight:900; font-size:13px; cursor:pointer; color:#334155; }
  .tabbtns button.sel { background:#0ea5e9; border-color:#0284c7; color:#fff; }
  .calcgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .calcgrid button { border:none; border-radius:16px; padding:16px 0; font-size:20px; font-weight:900; cursor:pointer; background:#eef2ff; color:#3730a3; box-shadow:0 3px 0 #c7d2fe; }
  .calcgrid button:active { transform:translateY(2px); box-shadow:none; }
  .calcgrid button.op { background:#fde68a; color:#92400e; }
  .calcgrid button.eq { background:#22c55e; color:#fff; }
  .calcdisp { background:#1e293b; color:#7dd3fc; border-radius:16px; padding:16px; font-size:30px; font-weight:900; text-align:right; font-family:'Consolas',monospace; min-height:64px; word-break:break-all; }
  .mathprob { font-size:34px; font-weight:900; text-align:center; padding:16px; background:linear-gradient(180deg,#eff6ff,#dbeafe); border-radius:18px; margin:10px 0; color:#1e3a8a; }
  .engword { cursor:pointer; }
  .engword .en { font-weight:900; color:#0e7490; }
  .engword .es { font-size:11px; color:#64748b; }
</style>
</head>
<body>
<div id="app"></div>
<div id="navbox"></div>
<div id="dragonfab"></div>
<script>
/* =========================================================
   GO DARIUS PRO — App de lenguaje y aprendizaje gamificada
   Un archivo HTML. Sin backend. Datos en localStorage.
   ========================================================= */

// ---------- ESTADO ----------
const DEFAULT_STATE = {
  name: "Darius", age: 4, gender: "nino", stars: 0, totalStars: 0, theme: "",
  worlds: { siento:{ok:0,err:0,clicks:0}, necesito:{ok:0,err:0,clicks:0}, dia:{ok:0,err:0,clicks:0},
            cuentos:{ok:0,err:0,clicks:0}, puente:{ok:0,err:0,clicks:0}, crear:{ok:0,err:0,clicks:0},
            mate:{ok:0,err:0,clicks:0}, english:{ok:0,err:0,clicks:0}, dibujar:{ok:0,err:0,clicks:0} },
  today: { date:"", minutes:0, ok:0, err:0, emotions:0, missions:[], gift:false },
  history: [], phrases: [], customDia: [], customMotivos: []
};
let S = loadState();
function loadState(){
  try { const raw = localStorage.getItem("gdpro2"); if(raw){ const p = JSON.parse(raw); return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), p); } } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save(){ try { localStorage.setItem("gdpro2", JSON.stringify(S)); } catch(e){} }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esNina(){ return S.gender === "nina"; }
function gChamp(){ return esNina() ? "campeona" : "campeón"; }
function gHeroe(){ return esNina() ? "heroína" : "héroe"; }
function setGenero(g){ S.gender = g; save(); applyTheme(); go("dad", {back:true}); }
function ensureToday(){ if(S.today.date !== todayISO()){ S.today = { date:todayISO(), minutes:0, ok:0, err:0, emotions:0, missions:[], gift:false }; save(); } }
setInterval(()=>{ ensureToday(); if(document.visibilityState==="visible"){ S.today.minutes += 0.5; save(); } }, 30000);

// ---------- VOZ ----------
function speak(text, lang, cb){
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "es-ES"; u.rate = 0.85; u.pitch = 1.12;
    if(cb) u.onend = cb;
    speechSynthesis.speak(u);
  } catch(e){ if(cb) cb(); }
}

// ---------- SONIDOS ----------
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null;
function tone(freq, dur, delay, type, vol){
  try{
    if(!actx) actx = new AC();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  ok(){ [523,659,784].forEach((f,i)=>tone(f,.25,i*.09,"triangle",.18)); },
  star(){ [880,1174].forEach((f,i)=>tone(f,.3,i*.12,"sine",.15)); },
  bad(){ tone(220,.3,0,"sine",.12); },
  tap(){ tone(660,.08,0,"sine",.07); },
  unlock(){ [523,659,784,1046].forEach((f,i)=>tone(f,.35,i*.11,"triangle",.2)); }
};
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function confetti(){
  const ems = ["⭐","🎉","✨","🌟","🎊","💛"];
  for(let i=0;i<36;i++){
    const d = document.createElement("div");
    d.className = "confetti";
    d.textContent = ems[Math.floor(Math.random()*ems.length)];
    d.style.left = (Math.random()*100)+"vw";
    d.style.animationDelay = (Math.random()*0.5)+"s";
    d.style.fontSize = (18+Math.random()*20)+"px";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 2800);
  }
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

// ---------- PREMIOS / DESBLOQUEOS ----------
const UNLOCKS = [
  { at:5,   id:"d1",  emoji:"🐲", label:"¡Dragón rojo amigo!", tipo:"dragon" },
  { at:8,   id:"dog", emoji:"🐶", label:"¡Perrito mascota!", tipo:"amigo" },
  { at:10,  id:"hat", emoji:"👑", label:"¡Corona para Darius!", tipo:"item" },
  { at:12,  id:"d2",  emoji:"🦕", label:"¡Dragón verde amigo!", tipo:"dragon" },
  { at:15,  id:"magohat", emoji:"🎩", label:"¡Sombrero de mago!", tipo:"item" },
  { at:18,  id:"cat", emoji:"🐱", label:"¡Gatito mascota!", tipo:"amigo" },
  { at:20,  id:"w-espacio", emoji:"🚀", label:"¡Mundo Astronauta!", tipo:"mundo", theme:"t-space" },
  { at:22,  id:"d3",  emoji:"🦖", label:"¡Dragón morado amigo!", tipo:"dragon" },
  { at:25,  id:"robot", emoji:"🤖", label:"¡Robot amigo!", tipo:"amigo" },
  { at:30,  id:"w-bruja", emoji:"🧙", label:"¡Mundo de la Bruja!", tipo:"mundo", theme:"t-bruja" },
  { at:32,  id:"fones", emoji:"🎧", label:"¡Audífonos cool!", tipo:"item" },
  { at:35,  id:"uni", emoji:"🦄", label:"¡Unicornio amigo!", tipo:"amigo" },
  { at:40,  id:"w-escuela", emoji:"🏫", label:"¡Mundo Escuela!", tipo:"mundo", theme:"t-escuela" },
  { at:45,  id:"guitar", emoji:"🎸", label:"¡Guitarra de roca!", tipo:"item" },
  { at:50,  id:"w-neon", emoji:"🌃", label:"¡Mundo Neon del Robot!", tipo:"mundo", theme:"t-neon" },
  { at:55,  id:"dolph", emoji:"🐬", label:"¡Delfín amigo!", tipo:"amigo" },
  { at:60,  id:"w-futbol", emoji:"⚽", label:"¡Mundo Fútbol!", tipo:"mundo", theme:"t-futbol" },
  { at:65,  id:"d4",  emoji:"🐉", label:"¡Dragón dorado amigo!", tipo:"dragon" },
  { at:70,  id:"glasses", emoji:"🕶️", label:"¡Gafas de sol!", tipo:"item" },
  { at:80,  id:"w-mar", emoji:"🌊", label:"¡Mundo del Mar!", tipo:"mundo", theme:"t-mar" },

];
function todaysMissions(){
  ensureToday();
  if(!S.today.missionSet || !S.today.missionSet.length){
    S.today.missionSet = MISSION_POOL.slice().sort(()=>Math.random()-0.5).slice(0,3).map(m=>m.id);
    save();
  }
  return MISSION_POOL.filter(m=>S.today.missionSet.indexOf(m.id)>=0);
}
function completeMission(worldId){
  ensureToday();
  todaysMissions().forEach(m=>{
    if(m.worlds.includes(worldId) && !S.today.missions.includes(m.id)){
      S.today.missions.push(m.id);
      const all = todaysMissions().every(m2=>S.today.missions.includes(m2.id));
      if(all){
        addStar(2); confetti(); sfx.unlock();
        S.today.missions = [];
        S.today.missionSet = [];
        toast("🎁 ¡Misiones completadas! +2 ⭐ · ¡Ya tienes NUEVAS misiones!");
      } else {
        toast("✅ ¡Misión avanzada!");
      }
      save();
    }
  });
}
function regClick(wid){ S.worlds[wid].clicks++; save(); }
function regOk(wid, label){
  S.worlds[wid].ok++; S.today.ok++;
  if(wid==="siento") S.today.emotions++;
  S.history.push({ t: label, w: wid, d: todayISO(), ts: Date.now() });
  if(S.history.length>200) S.history = S.history.slice(-200);
  addStar(1); sfx.ok(); buzz(60); confetti(); completeMission(wid); save();
}
function regErr(wid){ S.worlds[wid].err++; S.today.err++; save(); }

let navStack = [];

const SCREENS = {};

SCREENS.home = function(){
  ensureToday(); applyTheme(); renderDragonFab();
  const missions = todaysMissions();
  const t = S.totalStars;
  const hat = t >= 10 ? '<span class="hat">👑</span>' : '';
  const avgLvl = Math.round((Object.keys(S.worlds).reduce((a,w)=>a+worldLevel(w),0))/Object.keys(S.worlds).length*10)/10;

  let mHtml = missions.map(m=>{
    const done = S.today.missions.includes(m.id);
    return '<div class="mission-item ' + (done?'done':'') + '"><div class="mcheck">' + (done?'✓':'') + '</div><span>' + m.label + '</span></div>';
  }).join("");
  const allDone = missions.every(m=>S.today.missions.includes(m.id));

  const worldHtml = WORLDS.map(w=>{
    const lvl = worldLevel(w.id);
    const pct = (S.worlds[w.id].ok % 4) * 25;
    return '<div class="world" style="background:' + w.color + '" onclick="sfx.tap();go(\'world\',{param:\'' + w.id + '\'})">' +
      '<div class="wemoji floaty">' + w.emoji + '</div>' +
      '<div class="winfo"><b>' + w.name + '</b><small>' + w.desc + '</small>' +
      '<div class="lvlbar"><i style="width:' + pct + '%"></i></div></div>' +
      '<div class="wstars">Nv ' + lvl + ' · ' + S.worlds[w.id].ok + '⭐</div></div>';
  }).join("");

  const prizeHtml = UNLOCKS.map(u=>{
    const got = t >= u.at;
    if(got && u.tipo==="mundo"){
      return '<div class="unlockrow won" onclick="usePrize(' + JSON.stringify(u).replace(/"/g,'&quot;') + ')"><span style="font-size:22px">' + u.emoji + '</span><span>' + u.label.replace(" desbloqueado! Tócalo para viajar.","") + ' <small style="color:#0284c7">· ¡tócalo para viajar!</small></span><span style="margin-left:auto;font-size:12px;background:#fef9c3;padding:2px 8px;border-radius:99px">' + u.at + ' ⭐</span></div>';
    }
    return '<div class="unlockrow ' + (got?'won':'locked2') + (got?'':'') + '"' + (got?' onclick="showPrizeModal(' + JSON.stringify(u).replace(/"/g,'&quot;') + ')"':'') + '><span style="font-size:22px">' + (got?u.emoji:"🔒") + '</span><span>' + u.label + (got?' <small style="color:#0284c7">· ¡tócalo para verlo!</small>':'') + '</span><span style="margin-left:auto;font-size:12px;background:#f1f5f9;padding:2px 8px;border-radius:99px">' + u.at + ' ⭐</span></div>';
  }).join("");

  return '<div class="topbar">' +
    '<div class="avatar floaty">🐉' + (esNina() ? "🎀" : "") + hat + '</div>' +
    '<div class="hello"><h1>¡Hola, ' + S.name + '!</h1><span class="lvlbadge">Eres ' + (esNina() ? "una campeona" : "un campeón") + ' · Nivel global ' + avgLvl + ' · 🐉 ' + dragonsCollection().length + ' en mi colección</span></div>' +
    '<div class="starbox"><span class="st">⭐</span><span id="starcount">' + S.stars + '</span></div>' +
  '</div>' +

  '<div class="dragontip"><div class="dem">🐉</div><p>' + dragonTip() + '</p></div>' +

  '<div class="card"><h2>🎯 Misión de hoy</h2>' + mHtml +
    '<div class="giftrow ' + (allDone?'ready':'') + '">' + (allDone?'🎁 ¡Misión completada! Bonus ganado':'🎁 Completa las 3 misiones: +2 ⭐') + '</div></div>' +

  '<div class="sectiontitle">🗺️ MAPA DE MUNDOS · ¡todos abiertos para ti!</div>' +
  '<div class="map">' + worldHtml + '</div>' +

  '<div class="card"><h2>🏆 Mis premios (' + UNLOCKS.filter(u=>t>=u.at).length + '/' + UNLOCKS.length + ')</h2>' + prizeHtml + '</div>' +

  '<button class="dadbtn" onclick="sfx.tap();go(\'dad\')">👨‍👩‍👦 Modo Papá</button>';
};
function dragonTip(){
  const tips = [
    "¡Toca un mundo y ganemos estrellas juntos!",
    "Recuerda: después de escuchar, ¡repite la frase tú también!",
    "Las palabras mágicas unen tus ideas. ¿Probamos?",
    "¡Cuéntame tu día! Yo te ayudo a contarlo bonito.",
    "Cada estrella me hace más fuerte. ¡Vamos!",
    "Toca mi botón 🐉 abajo ¡y verás quién saluda!",
    "Las estrellas te dan premios, dragones y mundos nuevos."
  ];
  return tips[(new Date().getDate() + new Date().getHours()) % tips.length];
}

};
function mountWorld(wid){
  const el = document.getElementById("worldbody");

  if(wid==="puente") el.innerHTML = puenteHtml();
  if(wid==="mate") el.innerHTML = mateHtml();
  if(wid==="english") el.innerHTML = englishHtml();
  if(wid==="crear") el.innerHTML = crearHtml();

// ===== MUNDO 1: EMOCIONES =====
let emoSel = null, emoNivel = "normal", emoMotivoIdx = -1, emoCustomTxt = "";
function sientoHtml(){
  emoSel=null; emoNivel="normal"; emoMotivoIdx=-1;
  return '<div class="card"><h2>Paso 1 · ¿Cómo te sientes?</h2>' +
    '<div class="gridbtns" style="grid-template-columns:repeat(4,1fr)">' +
    EMOCIONES.map(e=>'<div class="chip" style="background:' + e.c + '" onclick="pickEmo(' + EMOCIONES.indexOf(e) + ')"><span class="big">' + e.emoji + '</span>' + e.n + '</div>').join("") +
    '</div></div><div class="card" id="emo-next"></div>';
}
function pickEmo(i){
  regClick("siento");
  emoSel = EMOCIONES[i]; emoNivel = "normal"; emoMotivoIdx = -1; emoCustomTxt = "";
  speak("Me siento " + emoSel.n);
  document.getElementById("emo-next").innerHTML =
    '<h2>' + emoSel.emoji + ' Paso 2 · ¿Un poquito o mucho?</h2>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    NIVELES.map(nv=>'<div class="chip" style="flex:1;padding:10px" onclick="pickNivel(\'' + nv.t + '\')" id="nv-' + nv.t + '"><span class="big">' + nv.e + '</span>' + nv.t + '</div>').join("") +
    '</div><h2 style="margin-top:14px">Paso 3 · ¿Por qué? Toca lo que pasó</h2>' +
    '<div class="gridbtns" style="grid-template-columns:repeat(3,1fr)">' +
    motivosAll().map((m,i)=>'<div class="chip' + (m.custom?' newone':'') + '" style="padding:8px 4px" onclick="pickMotivo(' + i + ')" id="mot-' + i + '"><span class="big">' + m.emoji + '</span><span style="font-size:11px">' + m.t + '</span></div>').join("") +
    '</div>' +
    '<div class="inputrow" style="margin-top:12px"><textarea id="emo-custom" placeholder="✍️ O escribe tu propio motivo…"></textarea>' +
    '<div style="display:flex;gap:8px;margin-top:8px">' +
    '<button class="bigbtn" style="flex:1;background:#0ea5e9" onclick="usarCustomMotivo()">💬 Usarlo ahora</button>' +
    '<button class="bigbtn" style="flex:1;background:#22c55e" onclick="usarCustomMotivo(true)">💾 Usarlo y guardarlo</button></div></div>' +
    '<div id="emo-frase"></div>';
}
function emoMotivoTexto(){
  if(emoMotivoIdx >= 0) return motivosAll()[emoMotivoIdx].t;
  if(emoCustomTxt) return "porque " + emoCustomTxt;
  return null;
}
function emoFrase(){
  if(!emoSel) return "";
  const m = emoMotivoTexto();
  return "Me siento " + (emoNivel!=="normal" ? emoNivel + " " : "") + emoSel.n + (m ? ", " + m : "") + ".";
}
function pickNivel(t){
  regClick("siento"); emoNivel = t;
  NIVELES.forEach(nv=>{ const el=document.getElementById("nv-"+nv.t); if(el) el.classList.toggle("sel", nv.t===t); });
  speak("Me siento " + (t!=="normal"?t+" ":"") + emoSel.n);
  updateEmoFrase();
}
function pickMotivo(i){
  regClick("siento"); emoMotivoIdx = i; emoCustomTxt = "";
  motivosAll().forEach((m,j)=>{ const el=document.getElementById("mot-"+j); if(el) el.classList.toggle("sel", j===i); });
  speak(emoFrase());
  updateEmoFrase();
}
function usarCustomMotivo(guardar){
  regClick("siento");
  const v = (document.getElementById("emo-custom").value||"").trim();
  if(!v){ toast("✍️ Escribe tu motivo primero"); return; }
  emoCustomTxt = v; emoMotivoIdx = -1;
  if(guardar){
    S.customMotivos.push("porque " + v);
    toast("💾 ¡Guardado para siempre!");
  }
  speak(emoFrase());
  updateEmoFrase();
}
function updateEmoFrase(){
  const el = document.getElementById("emo-frase");
  el.innerHTML = '<div class="phrasebar" style="margin-top:12px"><span class="token">' + emoFrase() + '</span></div>' +
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
    '<button class="bigbtn" style="flex:1;background:#0ea5e9" onclick="speak(emoFrase())">🔊 Escuchar</button>' +
    '<button class="bigbtn" style="flex:1;background:#22c55e" onclick="finishSiento()">✅ ¡Lo dije!</button></div>';
}
function finishSiento(){
  regOk("siento", "Expresó: " + emoFrase());
  toast("⭐ ¡Bravo! Dijiste lo que sientes");
}

// ===== MUNDO 2: FRASES MÁGICAS (AAC) =====
let aacIntento = null, aacObjeto = null, aacExtra = null;
function aacHtml(){
  aacIntento=null; aacObjeto=null; aacExtra=null;
  return '<div class="card"><h2>Paso 1 · ¿Qué quieres decir?</h2>' +
    '<div class="gridbtns" style="grid-template-columns:repeat(2,1fr)">' +
    AAC_INTENTOS.map((it,i)=>'<div class="chip" style="background:' + it.color + '33;border-color:' + it.color + '" onclick="pickIntento(' + i + ')"><span class="big">💬</span>' + it.texto + '</div>').join("") +
    '</div><div id="aac-steps"></div></div>';
}
function aacFrase(){
  let f = aacIntento ? aacIntento.texto : "";
  if(aacObjeto) f += " " + aacObjeto.t;
  if(aacExtra) f += " " + aacExtra.t;
  return f ? f + "." : "";
}
function renderAacFrase(){
  const el = document.getElementById("aac-frase");
  const f = aacFrase();
  el.innerHTML = f
    ? '<div class="phrasebar"><span class="token">' + f + '</span></div>' +
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
      '<button class="bigbtn" style="flex:1;background:#0ea5e9" onclick="speak(aacFrase())">🔊 Escuchar</button>' +
      '<button class="bigbtn" style="flex:1;background:#22c55e" onclick="finishAac()">✅ ¡Lo dije!</button></div>'
    : '<div class="phrasebar"><span class="token empty">Arma tu frase tocando las imágenes…</span></div>';
}
function pickIntento(i){
  regClick("necesito");
  aacIntento = AAC_INTENTOS[i]; aacObjeto = null; aacExtra = null;
  speak(aacIntento.texto);
  document.getElementById("aac-steps").innerHTML =
    '<h2 style="margin-top:14px">Paso 2 · ¿Qué exactamente?</h2>' +
    '<div class="gridbtns" style="grid-template-columns:repeat(4,1fr)">' +
    aacIntento.items.map((it,j)=>'<div class="chip" onclick="pickObjeto(' + j + ')" id="obj-' + j + '"><span class="big">' + it.e + '</span>' + it.t + '</div>').join("") +
    '</div><h2 style="margin-top:14px">Paso 3 · ¿Algo más?</h2>' +
    '<div class="gridbtns" style="grid-template-columns:repeat(3,1fr)">' +
    AAC_EXTRAS.map((ex,j)=>'<div class="chip" style="background:#f1f5f9" onclick="pickExtra(' + j + ')" id="ext-' + j + '"><span class="big">' + ex.e + '</span>' + ex.t + '</div>').join("") +
    '</div><div id="aac-frase" style="margin-top:14px"></div>';
  renderAacFrase();

// Cuentos dinámicos: los detalles cambian en cada lectura
const DYN_POOLS = {
  c: ["rojo","azul","verde","amarillo","morado","anaranjado","rosa"],
  f: ["un tesoro brillante","un cohete veloz","una pelota gigante","una torta enorme","un globo mágico","un mapa secreto"],
  a: ["perrito","gatito","conejito","osito","pajarito","zorrito"]
};
let cuentoVars = {};
function dynPrep(cuento){
  cuentoVars = {};
  const todo = JSON.stringify(cuento);
  ["c","f","a"].forEach(k=>{
    if(todo.indexOf("{" + k + "}") >= 0){
      const pool = DYN_POOLS[k];
      cuentoVars[k] = pool[Math.floor(Math.random()*pool.length)];
    }
  });
}
function dynTxt(t){ return String(t).replace(/\{([cfa])\}/g, function(m,k){ return cuentoVars[k] || ""; }); }

function mateGenQ(){
  const max = mateNivel;
  let a, b;
  if(mateNivel===10){ a = 1+Math.floor(Math.random()*9); b = 1+Math.floor(Math.random()*9); }
  else if(mateNivel===100){ a = 10+Math.floor(Math.random()*89); b = 1+Math.floor(Math.random()*89); }
  else { a = 100+Math.floor(Math.random()*899); b = 10+Math.floor(Math.random()*899); }
  if(mateOp==="-" && b>a){ const tmp=a; a=b; b=tmp; }
  const res = mateOp==="+" ? a+b : a-b;
  const distract = res + (Math.random()<0.5 ? 1 : -1) * (1+Math.floor(Math.random()*3));
  const ops = Math.random()<0.5 ? [res, distract] : [distract, res];
  mateQ = { a:a, b:b, res:res, ops:ops, c: ops.indexOf(res) };
}
function mateAnswer(i){
  regClick("mate");
  const fb = document.getElementById("mate-fb");
  if(i === mateQ.c){
    mateStreak++; regOk("mate", "Resolvió: " + mateQ.a + mateOp + mateQ.b);
    fb.innerHTML = '<p class="feedback ok">🎉 ¡Correcto! ' + mateQ.a + " " + mateOp + " " + mateQ.b + ' = ' + mateQ.res + '</p>';
    speak("¡Correcto! ¡Muy bien!");

    mateStreak = 0; regErr("mate"); sfx.bad(); buzz(120);

let calcA = "", calcOp = "", calcB = "", calcRes = null;
function mateCalcHtml(){
  calcA=""; calcOp=""; calcB=""; calcRes=null;
  return '<div class="card"><h2>🧮 Mi calculadora</h2>' +
    '<div class="calcdisp" id="calcdisp">0</div>' +
    '<div class="calcgrid">' +
    ["7","8","9","÷","4","5","6","×","1","2","3","−","C","0","⌫","+"].map(k=>{
      const cls = "÷×−+".includes(k) ? "op" : "";
      const act = "÷×−+".includes(k) ? 'calcSetOp(\'' + (k==="÷"?"/":k==="×"?"*":k==="−"?"-":"+") + '\')' :
        k==="C" ? 'calcClear()' : k==="⌫" ? 'calcBack()' : 'calcNum(\'' + k + '\')';
      return '<button class="' + cls + '" onclick="' + act + '">' + k + '</button>';
    }).join("") +
    '<button class="eq" style="grid-column:span 4;font-size:22px" onclick="calcEq()">= ¡Cuéntalo! 🔊</button>' +
    '</div></div>';
}
function calcRender(){
  const d = document.getElementById("calcdisp");
  let txt = calcA || "0";
  if(calcOp) txt += " " + (calcOp==="*"?"×":calcOp==="/"?"÷":calcOp) + " ";
  if(calcB) txt += calcB;
  if(calcRes !== null) txt += " = " + calcRes;
  d.textContent = txt;
}
function calcNum(n){ if(calcRes!==null){calcA=String(calcRes);calcOp="";calcB="";calcRes=null;} if(!calcOp){calcA+=n;} else {calcB+=n;} calcRender(); sfx.tap(); }
function calcSetOp(o){ if(calcA){ calcOp=o; calcRes=null; } calcRender(); sfx.tap(); }
function calcClear(){ calcA="";calcOp="";calcB="";calcRes=null; calcRender(); sfx.tap(); }
function calcBack(){ if(calcB){calcB=calcB.slice(0,-1);} else if(calcOp){calcOp="";} else {calcA=calcA.slice(0,-1);} calcRender(); sfx.tap(); }
function calcEq(){
  if(!calcA || !calcOp || !calcB) return;
  const a = parseFloat(calcA), b = parseFloat(calcB);
  let r;
  if(calcOp==="+") r = a+b;
  if(calcOp==="-") r = a-b;
  if(calcOp==="*") r = a*b;
  if(calcOp==="/") r = b!==0 ? +(a/b).toFixed(2) : 0;
  calcRes = r;
  calcRender();
  const opName = calcOp==="+"?"más":calcOp==="-"?"menos":calcOp==="*"?"por":"dividido entre";
  speak(a + " " + opName + " " + b + " es igual a... " + r);
  regClick("mate");
  toast("🧮 ¡Calculado!");
}

const EN_UNIDADES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const EN_DECENAS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numToEn(n){
  n = parseInt(n,10);
  if(isNaN(n) || n<0 || n>1000000) return null;
  if(n===1000000) return "one million";
  function sub999(x){
    if(x===0) return "";
    if(x<20) return EN_UNIDADES[x];
    if(x<100) return EN_DECENAS[Math.floor(x/10)] + (x%10 ? "-" + EN_UNIDADES[x%10] : "");
    const h = Math.floor(x/100), r = x%100;
    return EN_UNIDADES[h] + " hundred" + (r ? " " + sub999(r) : "");
  }
  if(n<1000) return sub999(n) || "zero";
  const th = Math.floor(n/1000), r = n%1000;
  return (th===1 ? "one thousand" : sub999(th) + " thousand") + (r ? " " + sub999(r) : "");
}

function normaliza(txt){
  return String(txt).toLowerCase().trim()
    .replace(/[¡¿!?.,;:]/g,"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function singulariza(w){
  if(w.length>4 && w.slice(-3)==="ces") return w.slice(0,-3) + "z";     // luces->luz, lápices->lápiz
  if(w.length>4 && w.slice(-2)==="es") return w.slice(0,-2);            // leones->león
  if(w.length>3 && w.slice(-1)==="s") return w.slice(0,-1);             // gatos->gato
  return w;
}

  // 1) directo (con o sin tilde)  2) plural -> singular  3) plural complejo -es
  if(ENG_NORM[n]) return ENG_NORM[n];
  if(ENG_NORM[singulariza(n)]) return ENG_NORM[singulariza(n)];
  // 4) plural por palabra en frases: "gatos negros" -> "gato negro"
  const uno = n.split(" ").map(w=>singulariza(w)).join(" ");
  if(ENG_NORM[uno]) return ENG_NORM[uno];
  return null;
}

let vozRec = null, vozStream = null, vozPermisoOk = false;
function vozAsegurarPermiso(){
  // Truco clave: obtenemos el micrófono UNA vez con getUserMedia y lo dejamos vivo.
  // Con el permiso ya concedido, SpeechRecognition no vuelve a preguntar.
  if(vozPermisoOk) return Promise.resolve(true);
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(false);
  return navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    vozStream = stream;           // NO lo cerramos: mantiene el permiso activo
    vozPermisoOk = true;
    return true;
  }).catch(function(){ return false; });
}
function vozDiagnostico(){
  // Devuelve un mensaje claro según el dispositivo/navegador
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR && !navigator.mediaDevices) return "🎤 Tu navegador no soporta el micrófono en esta app. ¡Escríbelo, funciona igual de bien! 💪";
  if(!SR) return "🎤 Este navegador no tiene reconocimiento de voz. ¡Escríbelo, funciona igual de bien! 💪";
  if(!window.isSecureContext) return "🔒 El micrófono solo funciona en páginas seguras (https). Tip: sube el archivo a un hosting gratis (Netlify, GitHub Pages) o úsalo en Brave/PC. Mientras tanto, ¡escríbelo! 💪";
  return null; // todo bien
}
function escucharVoz(){
  const estado = document.getElementById("voz-estado");
  const problema = vozDiagnostico();
  if(problema){ estado.innerHTML = problema; sfx.bad(); return; }
  estado.innerHTML = "🎙️ Preparando el micrófono…";
  vozAsegurarPermiso().then(function(ok){
    try {
      if(!vozRec){
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        vozRec = new SR();
        vozRec.lang = "es-PE"; vozRec.interimResults = false; vozRec.maxAlternatives = 1;
        vozRec.continuous = false;
        vozRec.onresult = function(e){
          const dicho = e.results[0][0].transcript;
          document.getElementById("traducir-in").value = dicho;
          estado.innerHTML = "✨ Dijiste: <b>" + dicho + "</b>";
          traducirPalabra();
        };
        vozRec.onerror = function(ev){
          if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){
            vozPermisoOk = false; vozRec = null;
            estado.innerHTML = "🎤 Toca el candado 🔒 junto a la dirección y elige «Permitir micrófono»";
          } else if(ev.error === "no-speech"){
            estado.innerHTML = "🤫 No te escuché. ¡Habla fuerte y toca 🎤 otra vez!";
          } else if(ev.error === "network"){
            estado.innerHTML = "🌐 El reconocimiento de voz necesita internet. ¡Escríbelo mientras tanto!";
          } else {
            estado.innerHTML = "🤫 No te escuché bien. ¡Toca 🎤 e inténtalo otra vez!";
          }
        };
        vozRec.onend = function(){ /* listo para reusar: sin pedir permiso otra vez */ };
      }
      estado.innerHTML = "🎙️ Escuchando… ¡habla fuerte y claro!";
      sfx.tap();
      vozRec.start();
    } catch(e){
      if(e && e.name === "InvalidStateError") return; // ya estaba escuchando
      estado.innerHTML = "🎤 No pude usar el micrófono ahora. ¡Escríbelo, funciona igual! 💪";
    }
  });
}
function pronuncia(txt){
  // Pista de pronunciación: separa en sílabas simples para leerlo en español
  const t = String(txt).toLowerCase().replace(/[^a-z' -]/g,"");
  return t.split(" ").map(w=>{
    if(w.length<=3) return w.toUpperCase();
    const partes = w.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/g) || [w];
    return partes.map(p=>p.toUpperCase()).join("-");
  }).join(" · ");
}
function traducirPalabra(){
  regClick("english");
  const raw = (document.getElementById("traducir-in").value||"").trim();
  const out = document.getElementById("traducir-out");
  if(!raw){ out.innerHTML = "✍️ Escribe una palabra o frase primero"; return; }
  out.innerHTML = "⏳ Buscando la traducción…";
  traducirOnline(raw).then(function(en){

        '<br><span style="font-size:13px;color:#7c3aed;font-weight:900">🗣️ Se dice: ' + pronuncia(en) + '</span>';

          '<br><span style="font-size:13px;color:#7c3aed;font-weight:900">🗣️ Se dice: ' + pronuncia(off) + '</span>';
        speak(off, "en-US");
      } else {
        out.innerHTML = "🤔 No pude traducir eso. Revisa cómo está escrito.";
      }
    }
  }).catch(function(){
    const off = dictLookup(raw);
    if(off){ out.innerHTML = '✅ <b>' + raw + '</b> = <b style="color:#0e7490">' + off + '</b>'; speak(off, "en-US"); }
    else { out.innerHTML = "📴 Sin internet no pude traducir. ¡Prueba con las palabras de la app!"; }
  });
}
function traducirOnline(txt){
  return new Promise(function(resolve, reject){
    try {
      fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(txt) + "&langpair=es|en")
        .then(function(r){ return r.json(); })
        .then(function(data){
          const t = data && data.responseData && data.responseData.translatedText;
          if(t && t.indexOf("MYMEMORY WARNING") < 0 && t.toUpperCase() !== "NO QUERY") resolve(t);
          else resolve(null);
        })
        .catch(reject);
    } catch(e){ reject(e); }
  });
}

      q: "🔢 ¿Cómo se dice <b>" + n + "</b> en inglés?" };

  // colores
  const cols = ENG_VOCAB.find(c=>c.cat.indexOf("Colores")>=0).items;

  return { type:"colores", okIdx: opts.indexOf(word), opts:opts, hint: word.en,
    q: "🎨 Toca el color <b>" + word.en + "</b>" };

function initPizarra(){
  const cv = document.getElementById("pizarra");
  if(!cv || cv.dataset.ready) { if(cv) restorePizarra(cv); return; }
  cv.dataset.ready = "1";
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  let last = null;
  function pos(e){
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x:(t.clientX-r.left)*(cv.width/r.width), y:(t.clientY-r.top)*(cv.height/r.height) };
  }
  function start(e){ e.preventDefault(); last = pos(e); pizActive = true; }
  function move(e){
    if(!pizActive) return; e.preventDefault();
    const p = pos(e);
    ctx.strokeStyle = pizColor; ctx.lineWidth = pizSize;
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p;
  }
  function end(){ pizActive = false; last = null; }
  cv.addEventListener("touchstart", start, {passive:false});
  cv.addEventListener("touchmove", move, {passive:false});
  cv.addEventListener("touchend", end);
  cv.addEventListener("mousedown", start);
  cv.addEventListener("mousemove", function(e){ if(pizActive) move(e); });
  window.addEventListener("mouseup", end);
  pizCtx = ctx; pizCv = cv;
}

}

  ensureToday();
  const weekAgo = Date.now() - 7*24*3600*1000;
  const weekHist = S.history.filter(h=>h.ts >= weekAgo);
  const maxW = Math.max(1, ...WORLDS.map(w=>weekHist.filter(h=>h.w===w.id).length));
  const colors = { siento:"#f59e0b", necesito:"#10b981", dia:"#ef4444", cuentos:"#d946ef", puente:"#6366f1", crear:"#06b6d4", mate:"#2563eb", english:"#ef4444" };
  const weekBars = WORLDS.map(w=>{
    const n = weekHist.filter(h=>h.w===w.id).length;
    return '<div class="weekbar"><div class="wlabel"><span>' + w.emoji + " " + w.name + '</span><span>' + n + '</span></div>' +
      '<div class="wtrack"><div class="wfill" style="width:' + (n/maxW*100) + '%;background:' + (colors[w.id]||"#888") + '"></div></div></div>';
  }).join("");

  const tabla = WORLDS.map(w=>{
    const d = S.worlds[w.id];
    return '<tr><td>' + w.emoji + " " + w.name + '</td><td>' + d.ok + '</td><td>' + d.err + '</td><td>' + d.clicks + '</td></tr>';
  }).join("");

  const conDatos = WORLDS.filter(w=>S.worlds[w.id].clicks>0);
  const fortaleza = conDatos.slice().sort((a,b)=>S.worlds[b.id].ok - S.worlds[a.id].ok)[0];
  const mejorar = conDatos.slice().sort((a,b)=>S.worlds[b.id].err - S.worlds[a.id].err)[0];
  const masUsada = conDatos.slice().sort((a,b)=>S.worlds[b.id].clicks - S.worlds[a.id].clicks)[0];

  return '<div style="padding-top:14px">' +
  '<div class="card" style="background:linear-gradient(135deg,#334155,#1e293b);color:#fff"><h2 style="color:#fff">👨‍👩‍👦 Modo Papá — Panel</h2>' +
  '<p style="font-size:13px;font-weight:700;opacity:.85">Todo lo que ' + S.name + ' logró, está aquí.</p></div>' +

  '<div class="card"><h2>📅 Hoy</h2><div class="statgrid">' +
    '<div class="stat"><b>' + Math.round(S.today.minutes) + '</b><small>minutos jugados</small></div>' +
    '<div class="stat"><b>' + S.today.ok + '</b><small>aciertos</small></div>' +
    '<div class="stat"><b>' + S.today.emotions + '</b><small>emociones expresadas</small></div>' +
  '</div></div>' +

  '<div class="card"><h2>📈 Esta semana por habilidad</h2>' + weekBars +
  '<p style="font-size:11px;color:#64748b;font-weight:700">Actividades completadas en los últimos 7 días.</p></div>' +

  '<div class="card"><h2>📊 Detalle por sección</h2>' +
  '<table class="stats"><tr><th>Sección</th><th>✅</th><th>❌</th><th>👆</th></tr>' + tabla + '</table>' +
  (masUsada ? '<div class="tipbox">👆 Más usada: <b>' + masUsada.emoji + " " + masUsada.name + '</b> (' + S.worlds[masUsada.id].clicks + ' toques)</div>' : '') +
  (fortaleza && S.worlds[fortaleza.id].ok>0 ? '<div class="tipbox">💪 Fortaleza: <b>' + fortaleza.emoji + " " + fortaleza.name + '</b> (' + S.worlds[fortaleza.id].ok + ' completadas)</div>' : '') +
  (mejorar && S.worlds[mejorar.id].err>0 ? '<div class="tipbox">🎯 Dónde mejorar: <b>' + mejorar.emoji + " " + mejorar.name + '</b> (' + S.worlds[mejorar.id].err + ' errores). Acompáñal' + (esNina()?"a":"o") + ' 5 minutos en esa sección.</div>' : '') +
  '</div>' +

  '<div class="card"><h2>🏆 Progreso y premios</h2>' +
  '<p style="font-size:15px;font-weight:900">⭐ ' + S.totalStars + ' estrellas · ' + S.history.length + ' actividades históricas · 🐉 ' + dragonsCollection().length + ' dragones</p>' +
  UNLOCKS.map(u=>'<div class="unlockrow ' + (S.totalStars>=u.at?'':'locked2') + '"><span style="font-size:20px">' + (S.totalStars>=u.at?u.emoji:'🔒') + '</span><span>' + u.label + '</span><span style="margin-left:auto;font-size:11px;color:#64748b">' + u.at + ' ⭐</span></div>').join("") +
  '</div>' +

  '<div class="card"><h2>🕘 Últimas actividades</h2>' +
  (S.history.length ? S.history.slice(-10).reverse().map(h=>'<p style="font-size:13px;font-weight:700;padding:3px 0">• ' + h.t + ' <span style="color:#94a3b8">(' + h.d + ')</span></p>').join("") : '<p style="font-size:13px;font-weight:700;color:#94a3b8">Aún no hay actividades registradas.</p>') +
  '</div>' +

  '<div class="card"><h2>⚙️ Configuración</h2>' +
  '<div class="inputrow"><label style="font-weight:900;font-size:13px">Nombre de' + (esNina()?" la niña":"l niño") + '</label>' +
  '<input id="inp-nombre" value="' + S.name.replace(/"/g,'&quot;') + '"></div>' +
  '<div style="margin-top:12px"><label style="font-weight:900;font-size:13px">Edad (filtra cuentos y actividades)</label>' +
  '<div class="agebtns">' + [3,4,5,6,7,8].map(e=>'<button class="' + (S.age===e?'sel':'') + '" onclick="setEdad(' + e + ')">' + e + '</button>').join("") + '</div></div>' +
  '<div style="margin-top:12px"><label style="font-weight:900;font-size:13px">¿Es niño o niña? (cambia saludos e ícono)</label>' +
  '<div class="agebtns">' +
  '<button class="' + (!esNina()?'sel':'') + '" onclick="setGenero(\'nino\')">👦 Niño</button>' +
  '<button class="' + (esNina()?'sel':'') + '" onclick="setGenero(\'nina\')">👧 Niña</button>' +
  '</div></div>' +
  '<button class="bigbtn" style="background:#22c55e;width:100%;margin-top:14px" onclick="guardarPerfil()">✅ Guardar y volver</button>' +
  '<button class="bigbtn" style="background:#a855f7;width:100%;margin-top:10px" onclick="mostrarDiploma()">🏆 Ver Diploma de Logros</button>' +
  '<div class="card"><h2>📤 Sincronizar progreso entre dispositivos</h2>' +
  '<p style="font-size:12px;color:#64748b;font-weight:700">El progreso se guarda en este navegador. Para seguir en la PC, tablet o celular: exporta el código aquí abajo y pégalo en el otro dispositivo.</p>' +
  '<button class="bigbtn" style="background:#0ea5e9;width:100%;margin-top:8px" onclick="exportProgreso()">📤 Exportar mi código de progreso</button>' +
  '<div id="exp-area"></div>' +
  '<button class="bigbtn" style="background:#f59e0b;width:100%;margin-top:10px" onclick="mostrarImport()">📥 Importar progreso</button>' +
  '<div id="imp-area"></div></div>' +
  '</div>' +

  '<div class="card"><h2>💛 Guía: cómo usarlo con tu hij' + (esNina()?"a":"o") + '</h2>' +
  '<div class="tipbox"><b>1. Reformulá, no corrijas.</b> Si dice "comí… pelota", respondé "¡comiste, y luego jugaste con la pelota!". Nunca digas "no se dice así". Es la técnica con mayor evidencia científica.</div>' +
  '<div class="tipbox"><b>2. 5-10 minutos diarios</b> con vos presente, celebrando cada frase que repita en voz alta. La constancia gana a la duración.</div>' +
  '<div class="tipbox"><b>3. Preguntas abiertas en los cuentos:</b> "¿y tú qué harías?", "¿por qué crees que lloró?".</div>' +
  '<div class="tipbox"><b>4. Dejalo elegir el mundo.</b> La motivación es la mitad del trabajo. Todos los mundos están siempre abiertos.</div>' +
  '<div class="warnbox"><b>Importante:</b> esta app complementa, pero no reemplaza, una evaluación de fonoaudiólogo. Si a los casi 5 años no se le entiende la mayoría del tiempo, consultá a un especialista.</div>' +
  '</div>' +

  '<div class="card"><h2>💾 Historias creadas por ' + S.name + '</h2>' +
  (S.phrases.length ? S.phrases.slice().reverse().map(f=>'<p style="font-size:13px;font-weight:700;padding:4px 0">✍️ ' + f + '</p>').join("") : '<p style="font-size:13px;font-weight:700;color:#94a3b8">Las historias que cree aparecerán aquí.</p>') +
  '</div>' +

  '<button class="bigbtn" style="background:#ef4444;width:100%;margin-bottom:14px" onclick="resetStats()">🔄 Reiniciar estadísticas</button>' +
  '<button class="dadbtn" onclick="go(\'home\',{back:true})">🏠 Volver al juego</button>' +
  '</div>';
};
function setEdad(e){ S.age = e; save(); go("dad", {back:true}); }
function exportProgreso(){
  try {
    const json = JSON.stringify(S);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    const code = "GDP1-" + b64.replace(/=+$/,"");
    document.getElementById("exp-area").innerHTML =
      '<p style="font-size:12px;color:#64748b;font-weight:800;margin-top:10px">Copia este código y guárdalo (WhatsApp, notas…). En el otro dispositivo: Modo Papá → 📥 Importar.</p>' +
      '<textarea id="exp-code" readonly style="width:100%;min-height:90px;border-radius:14px;border:3px solid #bae6fd;padding:10px;font-size:12px;font-family:monospace">' + code + '</textarea>' +
      '<button class="bigbtn" style="background:#22c55e;width:100%;margin-top:8px" onclick="copiarCodigo()">📋 Copiar código</button>' +
      '<div id="exp-fb"></div>';
  } catch(e){ document.getElementById("exp-area").innerHTML = '<p class="feedback bad">No pude generar el código 😕</p>'; }
}
function copiarCodigo(){
  const ta = document.getElementById("exp-code");
  ta.select(); ta.setSelectionRange(0, 999999);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value); ok = true; }
  document.getElementById("exp-fb").innerHTML = ok ? '<p class="feedback ok">✅ ¡Código copiado!</p>' : '<p class="feedback bad">Selecciona el texto y cópialo manualmente</p>';
}
function mostrarImport(){
  document.getElementById("imp-area").innerHTML =
    '<p style="font-size:12px;color:#64748b;font-weight:800;margin-top:10px">Pega aquí el código de progreso del otro dispositivo:</p>' +
    '<textarea id="imp-code" style="width:100%;min-height:90px;border-radius:14px;border:3px solid #fde68a;padding:10px;font-size:12px;font-family:monospace" placeholder="GDP1-…"></textarea>' +
    '<button class="bigbtn" style="background:#22c55e;width:100%;margin-top:8px" onclick="importProgreso()">✅ Restaurar progreso</button>' +
    '<div id="imp-fb"></div>';
}
function importProgreso(){
  const code = (document.getElementById("imp-code").value||"").trim();
  const fb = document.getElementById("imp-fb");
  if(!code){ fb.innerHTML = '<p class="feedback bad">Pega el código primero</p>'; return; }
  try {
    if(code.indexOf("GDP1-")!==0) throw new Error("formato");
    let b64 = code.slice(5);
    while(b64.length % 4) b64 += "=";
    const json = decodeURIComponent(escape(atob(b64)));
    const data = JSON.parse(json);
    if(!data || !data.worlds || !data.name) throw new Error("datos");
    S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), data);
    save();
    fb.innerHTML = '<p class="feedback ok">✅ ¡Progreso restaurado! Las estrellas de ' + S.name + ' ya están aquí.</p>';
    confetti(); sfx.unlock();
    setTimeout(function(){ go("home", {back:true}); }, 1800);
  } catch(e){
    fb.innerHTML = '<p class="feedback bad">El código no es válido o está incompleto. Cópialo completo.</p>';
  }
}
function guardarPerfil(){
  const v = document.getElementById("inp-nombre").value.trim();
  S.name = v || "Darius"; save();
  toast("✅ Guardado"); go("home", {back:true});
}
function mostrarDiploma(){
  sfx.unlock(); confetti();
  const bg = document.createElement("div");
  bg.className = "modalbg";
  const hoy = new Date().toLocaleDateString("es-PE", { day:"numeric", month:"long", year:"numeric" });
  bg.innerHTML = '<div class="modalbox" style="background:linear-gradient(160deg,#fffbeb,#fef3c7);border:6px double #d97706;max-width:340px" onclick="this.parentElement.remove()">' +
    '<div style="font-size:44px">🏆🐉</div>' +
    '<p style="letter-spacing:3px;font-size:11px;font-weight:900;color:#b45309;margin-top:6px">DIPLOMA DE CAMPEÓN DE PALABRAS</p>' +
    '<h2 style="margin-top:10px;color:#92400e">' + S.name + '</h2>' +
    '<p style="font-size:14px;font-weight:800;color:#78350f;margin-top:8px">Por practicar el habla, la lectura, las matemáticas y el inglés con valentía y alegría.</p>' +
    '<div style="display:flex;justify-content:center;gap:14px;margin-top:12px;font-weight:900;color:#92400e">' +
      '<span>⭐ ' + S.totalStars + ' estrellas</span><span>🏅 ' + S.history.length + ' logros</span></div>' +
    '<p style="font-size:12px;color:#b45309;font-weight:800;margin-top:10px">' + hoy + ' · GO DARIUS PRO 🐉</p>' +
    '<p style="font-size:10px;color:#b45309;margin-top:8px">Toma una captura para imprimirlo 📸</p></div>';
  document.body.appendChild(bg);
  speak("¡Felicidades " + S.name + "! Eres " + (esNina()?"una campeona":"un campeón") + " de las palabras.");
}
function resetStats(){
  if(confirm("¿Seguro que quieres borrar todo el progreso y estadísticas?")){
    S = JSON.parse(JSON.stringify(DEFAULT_STATE)); save(); applyTheme(); go("home");
  }
}

// ---------- ARRANQUE ----------
applyTheme();
ensureToday();
go("home");
</script>
</body>
</html>
